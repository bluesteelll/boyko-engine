name: CI

on:
  push:
    branches: [master, ecs]
  pull_request:
    branches: [master, ecs]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `-C target-cpu=x86-64-v3` is NOT redundant with `.cargo/config.toml`, and leaving it
  # out was a silent defect from 2026-09-02 until it was measured the same day. The
  # `RUSTFLAGS` environment variable REPLACES `build.rustflags` and
  # `target.<triple>.rustflags` from the config rather than appending to them (Cargo
  # reference, "Environment variables that Cargo reads"). So every job below, which
  # inherits this value, was dropping the engine's declared ISA baseline: measured on the
  # gnu toolchain, `RUSTFLAGS="-D warnings"` gives 5 of 5 baseline features ABSENT.
  #
  # The consequence is not a slower build, it is a DIFFERENT one. Every
  # `cfg(target_feature = "avx2")` arm compiles to nothing: boyko_physics's 8-wide colored
  # solve, refresh_inertia, position_integrate, apply_gravity and the SDF narrowphase x8
  # kernels, plus `sdf_simd`'s entire `o9_kernel_tests` module — which had therefore never
  # compiled once, and whose tests had never run, until the baseline was turned on locally.
  # Absent code cannot go red, so CI reported green over all of it.
  #
  # `tests/isa_baseline_census.rs` now fails loudly when the baseline does not reach rustc,
  # so this class cannot go quiet again. If a job needs its own RUSTFLAGS, it must carry
  # this flag too, or that census will say so.
  #
  # ⚠ Assumes the runner supports AVX2. GitHub-hosted `ubuntu-latest` runners are Intel
  # Xeon (Skylake or newer) or AMD EPYC, all of which do; a runner without it would fail
  # with an illegal instruction on the first vectorised kernel, not a build error.
  RUSTFLAGS: "-D warnings -C target-cpu=x86-64-v3"

# 2026-07 audit, P0 build-gate finding: EVERY job below used to run a bare
# `cargo <cmd> --all-targets`. This workspace root is ALSO a package (`boyko-engine`,
# the `src/main.rs` placeholder binary), so Cargo's default selection at the root was
# THAT PACKAGE ALONE — the jobs compiled a `println!` in ~0.2 s and reported success
# while every engine crate went unchecked. The root cause is fixed in `Cargo.toml`
# (`default-members` now lists every member), and each job below ALSO says
# `--workspace` explicitly so the intent survives a future manifest edit.
#
# The `boyko_demo` / `bench_bevy_vs_boyko` exclusions mirror `docs.yml`'s own
# proven-on-this-runner set (eframe/wgpu and bevy are heavy third-party trees, not
# engine surface); `bench-compile` deliberately KEEPS `bench_bevy_vs_boyko` — compiling
# that crate's benches is the whole point of that job.
jobs:
  # The suppression half of the hot-path type ban. `clippy.toml` + the denied
  # `[workspace.lints.clippy] disallowed_types` stop a NEW `HashMap`/`Mutex`/`RefCell` from
  # compiling, but clippy cannot police its own `#[allow]`s — and an `#[allow]` on a `mod`
  # silences the ban for a whole subtree invisibly (measured 2026-07). This job forbids blanket
  # suppression in production code and requires every remaining exception to carry a row in
  # docs/HOT-PATH-EXCEPTIONS.md with a frequency class from a closed vocabulary of cold classes.
  hot-path-exceptions:
    name: hot-path exception registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_hotpath_exceptions.py

  # docs/diagnostics/ is a 22-file design corpus carved out of two plans that were each reviewed
  # twice and passed, and which the first reader to hold them side by side found asserting
  # CONTRADICTORY facts about the same object. Splitting them makes each piece reviewable and makes
  # that failure more likely, not less — two documents can disagree in one way, twenty-two in many.
  # Every file declares what it provides and assumes; this job walks the resulting graph so the
  # question "do these documents agree?" stops needing a reviewer who has read all of them at once.
  # The script exits 1 rather than passing quietly when the corpus is absent: a green gate with no
  # subject is the failure mode this campaign has caught nine times.
  doc-contracts:
    name: diagnostics corpus contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_doc_contracts.py

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --features boyko-ecs/profiling-analysis --exclude boyko_demo --exclude bench-bevy-vs-boyko

  # `--features boyko-ecs/profiling-analysis` is on every leg below that used to get it from
  # `boyko_ecs`'s default list. Profiling rung 14 made that feature OPT-IN — measured: while it was
  # default-on, no command line could turn it off, because nine sibling manifests depend on
  # `boyko-ecs` without `default-features = false` and unification restored it, so the axis's
  # `shipping` row would have been unenforceable.
  #
  # Passing it here is not a formality: SIX tests in `boyko_ecs`'s profiling suite are
  # `#[cfg(feature = "profiling-analysis")]`, and without the flag they are not compiled and not
  # run — a coverage loss that looks exactly like a green sweep. The feature-OFF side is covered by
  # the `profile-legs` matrix below, which builds four profiles that refuse it outright.
  test:
    name: cargo test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test --locked --workspace --all-targets --release --features boyko-ecs/profiling-analysis --exclude boyko_demo --exclude bench-bevy-vs-boyko
          else
            cargo test --locked --workspace --all-targets --features boyko-ecs/profiling-analysis --exclude boyko_demo --exclude bench-bevy-vs-boyko
          fi

  # ---------------------------------------------------------------------------------------------
  # The BOYKO_PROFILE axis — profiling rung 14 / logging L17, the joint rung J1
  # ---------------------------------------------------------------------------------------------
  #
  # `crates/boyko_diag/build.rs` is the ONE build script in this workspace and the ONE reader of
  # `BOYKO_PROFILE`. It sits at the bottom of the graph, so the variable changes the constants every
  # crate above compiles against: the logging ceiling, the profiling tier, the sample-region
  # capacity, the zone id space and the dynamic name arena. Five named profiles, of which `dev` is
  # what every OTHER job in this file already builds (the variable is unset there, and unset means
  # `dev`) — so this matrix is the **4 net new legs** `SEAM.md` §S9's arithmetic asks for, not five.
  #
  # `check` rather than `test`: the property these legs establish is that the workspace COMPILES in
  # every profile, and that is where the axis's failures live — a `const` assertion whose two sides
  # come from different rows, a `debug!` whose arguments go unused once the ceiling deletes it, a
  # store stride that no longer fits its own bound. Running the suite four more times would not test
  # the axis; it would test everything else four more times, and several suites assert `dev` values
  # by design (`boyko_log`'s `the_dev_profile_admits_every_level` is named for it).
  #
  # `fail-fast: false` because a profile-specific break tells you WHICH profile, and killing the
  # matrix at the first one throws that away. Per-leg `CARGO_TARGET_DIR` because two profiles in one
  # directory rebuild each other on every alternation.
  profile-legs:
    name: cargo check (BOYKO_PROFILE=${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [editor, shipping, shipping-min, off]
    env:
      BOYKO_PROFILE: ${{ matrix.profile }}
      CARGO_TARGET_DIR: target-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: profile-${{ matrix.profile }}
      - run: cargo check --locked --workspace --all-targets --exclude boyko_demo --exclude bench-bevy-vs-boyko

  # G14(a)/(b)/(c) and G16(a)/(b)/(c): the cross-profile symbol census and the two refusals.
  #
  # `SEAM.md` specifies these as a CI **step over two legs' artifacts, not a sixth leg**, and this is
  # that step — with one deviation, taken because the alternative is worse. GitHub jobs do not share
  # a filesystem, so "consume the other legs' artifacts" means uploading and downloading them, which
  # makes the census depend on four jobs succeeding and on an artifact round-trip. The harness builds
  # its own two legs instead: a 2-crate graph per leg, ~13 s for all five clauses on the author's
  # box, hermetic, and runnable locally — which matters, because a gate only CI can run is a gate
  # whose RED nobody has seen.
  #
  # `components: llvm-tools` is load-bearing and its absence is a RED, not a skip: without `llvm-nm`
  # the census cannot tell a folded site from a present one, and a gate that passes on every machine
  # lacking its tool is a gate that passes.
  profile-census:
    name: cross-profile symbol census (G14/G16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p profile-fixture --test profile_axis_census

  # Reflection GATES G4 item 1 (docs/REFLECTION-PLAN-GATES.md D7): the feature-ON legs,
  # debug AND release — §5's release-editor gap lives exactly where `debug_assert!`
  # compiles out, so a debug-only ON leg never exercises the configuration the gap is
  # about; the matrix mirrors the `test` job's. The OFF side is every other job: nothing
  # in the workspace enables `reflect`, so the ship configuration is what they compile.
  # Without this job, `boyko_reflect` is a package in the tree that never sees a compiler
  # — the `default-members` vacuity in a new costume.
  #
  # The `pkg/feature` spelling is load-bearing: a bare `--features reflect` across a
  # multi-package selection is ambiguous and is the form that silently selects nothing.
  #
  # BOYKO_REFLECT_LEG is the per-test non-vacuity marker (GATES G4 "non-vacuity inside
  # each leg"): `reflect_leg_nonvacuity.rs` asserts `cfg!(feature = "reflect")` whenever
  # this variable names a leg, and reds naming the leg if the feature is off — so
  # dropping `--features` here cannot turn the leg into a no-op that reports green
  # (`gj1_flag_cost`'s `flags_on()` precedent). The variable exists because an outer
  # feature selection is UNOBSERVABLE from inside a test process (measured at G2: the
  # test env is byte-identical under `--features …`), so the leg must name itself.
  # `tests/reflect_ci_coverage.rs` pins the flag and the variable together.
  reflect-on:
    name: cargo test reflect ON (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
    env:
      BOYKO_REFLECT_LEG: reflect-on
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test reflect ON (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test --locked -p boyko-reflect -p reflect-fixture --all-targets --no-fail-fast --release \
              --features reflect-fixture/reflect
          else
            cargo test --locked -p boyko-reflect -p reflect-fixture --all-targets --no-fail-fast \
              --features reflect-fixture/reflect
          fi

  # Reflection GATES G4 item 2, mirroring `profile-census` above: `components: llvm-tools`
  # is load-bearing and its absence is a RED, never a SKIP (GATES D6) — the census
  # panics without `llvm-nm` rather than reporting a pass on a machine that cannot
  # measure.
  reflect-census:
    name: reflect absence census (G3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p reflect-fixture --test reflect_absence_census

  # Reflection GATES G4 item 4 / D15: the ONLY CI leg that compiles an engine crate's
  # `reflect` feature — the leg that makes D3's whole permission meaningful. Deliberately
  # OUTSIDE Miri: this package reaches boyko_render -> boyko_rhi_vulkan, and Miri cannot
  # execute FFI (F18). The feature selection legitimately reaches boyko_demo's closure
  # through unification (F16); that is expected and is not the ship invocation — G2's
  # harness takes its ship readings from its own feature-clean `cargo tree` spawns.
  reflect-dogfood:
    name: cargo test reflect dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p reflect-dogfood --all-targets --no-fail-fast --features reflect-dogfood/reflect

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # Phase 5a cleared boyko_utils (13 warnings); Phase 5d cleared boyko_ecs
        # (~43 warnings). Workspace is now clean: no || true workaround needed.
        run: cargo clippy --locked --workspace --all-targets --features boyko-ecs/profiling-analysis --exclude boyko_demo --exclude bench-bevy-vs-boyko -- -D warnings

  # ---------------------------------------------------------------------------------------------
  # feature legs — the axis the standing gate cannot see
  # ---------------------------------------------------------------------------------------------
  #
  # `--all-targets` IS NOT `--all-features`, and the two names invite precisely the confusion that
  # cost this tree 32 days. `--all-targets` widens the TARGET set (lib, bins, tests, benches,
  # examples); the cfg set those targets compile under stays the default one. So the standing gate —
  # `cargo clippy --workspace --all-targets -- -D warnings`, the job directly above, which never
  # passes `--features` — is STRUCTURALLY BLIND to every `#[cfg(feature = "…")]` item in the
  # workspace. Not "weak on": blind. Such an item is not compiled at all, and rustc cannot go red
  # over a span it never sees.
  #
  # MEASURED 2026-09-18: `cargo check -p boyko_rhi_vulkan --features hwrt --lib` failed with
  # 10 × E0308, from two lines — `device.rs:3254` and `present/targets.rs:75` passed a `u16`
  # (`.number()`) where `warn!` takes a typed `WarnCode`. Commit 718a5129 (2026-08-17) introduced
  # that type and converted every site rustc showed it, INCLUDING both non-gated `W2102.number()`
  # sites in the same three-function group in `device.rs`, and left the `#[cfg(feature = "hwrt")]`
  # sibling sitting between them — because no build in this repository had ever compiled it. The
  # feature was un-compilable for ~248 commits / 32 days, and what finally compiled it was a person
  # running the GPU leg by hand.
  #
  # ⚠ THE ONE-FLAG ANSWER DOES NOT EXIST IN THIS TREE, by design rather than by neglect.
  # `--all-features` turns on `boyko-threadpool/tb-neg-m2w`, whose crate root answers with a
  # `compile_error!` unless `cfg(miri)` is set (it is the KE16 M2w deliberate-UB negative control),
  # and three `nightly` features that are E0554 on the stable channel. MEASURED 2026-09-18:
  # `cargo check --workspace --all-targets --all-features` dies on `boyko_shaderdsl`'s E0554 before
  # reaching a single engine crate. Per-feature legs are the only form that can work here.
  #
  # WHAT THIS JOB COVERS IS DERIVED, NOT LISTED, and that is the whole design. The leg set is every
  # feature `cargo metadata` reports MINUS the refusal table in the step below — so a feature added
  # tomorrow is covered BY DEFAULT and has to be argued out in writing, one line, with a reason. A
  # hand-written list of covered features has the opposite failure mode, and it is the exact one this
  # job exists to stop: a check that covers one feature while reading as though it covered all.
  #
  # ⚠ A REFUSAL THAT OVERSTATES ITS REASON IS THIS JOB'S OWN FAILURE MODE, and the first review of
  # the table below found one: `boyko-render` was refused as a crate that "does not compile for a
  # non-Windows target at all", on a measurement of 2 errors. RE-MEASURED 2026-09-18 on the same
  # triple, those 2 were ONE `error[E0601]` (`main` function not found in `orbit_cube_window`, which
  # is `#![cfg(windows)]` as a whole crate) plus cargo's own summary line — the LIB compiles, and
  # `cargo check -p boyko-render --features hwrt --lib --tests --target x86_64-unknown-linux-gnu`
  # exits 0 in 10.8 s from clean. The false row excluded three legs and left 34
  # `#[cfg(feature = "hwrt")]` sites under `crates/boyko_render/src` compiled by nothing: the exact
  # class this job exists to close, one crate over from where it was found. Hence the scope table
  # below — a leg whose LIB builds but whose example does not gets a NARROWER TARGET SET, never an
  # exclusion. An exclusion is only for a crate whose lib itself cannot be compiled here.
  #
  # ⚠ WHAT IT DOES NOT COVER, stated plainly for the same reason:
  #   * THE PLATFORM AXIS for `boyko-app` — the same blind spot on a different cfg, and still open.
  #     MEASURED 2026-09-18, `crates/boyko_app/src/diag.rs:184` spells `codes::E3004.number()`
  #     inside a `#[cfg(not(windows))]` reporter; it landed 2026-08-13 (b809041e), four days BEFORE
  #     the sweep that fixed its siblings, and was invisible to that sweep for the identical reason.
  #     It is not repaired here and no leg below would find it: `cargo check -p boyko-app --lib
  #     --target x86_64-unknown-linux-gnu` fails on DEFAULT features — RE-MEASURED 2026-09-18 with
  #     `--keep-going`: five printed diagnostics (2 × E0432, 3 × E0308), which rustc's summary line
  #     counts as "7 previous errors" — in the LIB, so unlike `boyko-render` no target scope can
  #     rescue those legs, and a feature leg for that crate would be measuring the platform instead
  #     of the feature. That same lib is in the target set of every `--workspace` job in this file
  #     (six, above and below this one, all on `ubuntu-latest`), so none of them can exit 0 on this
  #     runner as the tree stands. Reported, not repaired, here: the repair is in
  #     `crates/boyko_app`, not in this file.
  #   * CLIPPY LINTS on the gated code. These legs are `cargo check`, so rustc warnings do fail them
  #     (the top-level `RUSTFLAGS` carries `-D warnings`), but clippy-specific lints never run over
  #     any `#[cfg(feature = …)]` item in the tree. That hole is narrowed here, not closed.
  #   * `crates/boyko_render/examples/orbit_cube_window.rs` — the one target the scoped legs drop
  #     today (`--lib --tests` would also drop a bin or a bench; the crate has neither). It is
  #     `#![cfg(windows)]` by construction and NO job in this file compiles it — only the by-hand
  #     Windows recipe in `CLAUDE.md` does.
  #   * The eight refused features, each carrying its reason at the site.
  feature-legs:
    name: cargo check (per-feature legs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-legs
      # The refusal table is one of this job's TWO hand-maintained lists (the scope table below is
      # the other), and every row in either is a measured claim rather than a preference. A row whose
      # `pkg/feature` no longer exists fails the step: an exclusion that outlives its subject is a
      # coverage claim nobody re-reads.
      - name: derive the legs from cargo metadata
        shell: bash
        run: |
          cat > feature-refusals.txt <<'EOF'
          bench-bevy-vs-boyko/bench-alloc|cost: the bevy tree is excluded from every other job in this file (see the note above `jobs:`); `bench-compile` is the one job that builds this crate, default-featured.
          bench-bevy-vs-boyko/nightly|cost: the same bevy tree as the row above, which is the operative reason and is enough on its own. RE-MEASURED 2026-09-18: `#![cfg_attr(feature = "nightly", feature(float_algebraic))]` is NOT a crate-root attribute, it is at `benches/g6_for_each_chunk.rs:7` -- one bench target -- so the old `channel:` label overstated a per-target E0554 as a crate-wide one. Refused here on cost; the nightly-green claim was not re-measured (building the bevy tree twice is what "cost" means).
          boyko-threadpool/tb-neg-m2w|by-design: `crates/boyko_threadpool/src/lib.rs:99` is a `compile_error!` refusing this feature whenever `cfg(miri)` is unset -- it is the KE16 M2w deliberate-UB negative control, and a native artifact built from it commits a Tree-Borrows violation on purpose. Its gate is `scripts/tb_neg_gate.{ps1,sh}` under Miri. VERIFIED 2026-09-18 at that line.
          boyko_sdf_math/nightly|KNOWN-RED 2026-09-18, an open defect and NOT a coverage judgement: it forwards to `boyko_shaderdsl/nightly` (the row below) and dies INSIDE that dependency, so `boyko_sdf_math` itself is never compiled and the counts below are `boyko_shaderdsl`'s rather than this crate's. RE-MEASURED 2026-09-18, `--all-targets`: 9 errors in the `boyko_shaderdsl` lib on stable-msvc, 10 on nightly-msvc.
          boyko_shaderdsl/nightly|KNOWN-RED 2026-09-18, an open defect and NOT a coverage judgement: the arm makes the crate `no_std` while `src/ssao.rs` uses `format!`/`String`, and it calls `core::intrinsics::{sinf32,cosf32}`, which current nightly no longer has. RE-MEASURED 2026-09-18 on the lib target, identical under `--lib` and `--all-targets`: 9 errors on stable-msvc (E0554 among them), 10 on nightly-msvc -- broken on BOTH channels, not merely channel-gated. `--all-targets` ALSO fails the lib-test unit, 8 errors stable / 9 nightly, so the lib count is not the whole command's. The earlier `11` was wrong at every scope. Covering it would make this job permanently red, and a permanently red job is one nobody reads.
          boyko-app/hwrt|platform: `boyko-app`'s LIB does not compile for a non-Windows target. RE-MEASURED 2026-09-18 with `--keep-going`, `cargo check -p boyko-app --lib --target x86_64-unknown-linux-gnu` on DEFAULT features: five printed diagnostics, which rustc's summary line counts as "7 previous errors" -- 2 x `error[E0432]: unresolved import crate::gpu_scene` (`runner.rs:77`, `particle_readback.rs:34`; the module is `#[cfg(windows)]` at `lib.rs:60-61`) and 3 x `error[E0308]`, all three at `diag.rs:184` in the `#[cfg(not(windows))]` reporter. Because it is the LIB, no narrower target scope rescues this leg the way `boyko-render`'s was rescued. NO CI job compiles this feature; the by-hand Windows check `cargo check -p boyko-app --features hwrt --all-targets` was VERIFIED green (0 errors, 0 warnings) on stable-msvc 2026-09-18.
          boyko-app/profiling-alloc|platform: same crate, same measurement as the row above. Its by-hand Windows check (`--features profiling-alloc --all-targets`) was VERIFIED green on stable-msvc 2026-09-18.
          boyko-app/profiling-census|platform: same crate, same measurement as the row above. Its by-hand Windows check (`--features profiling-census --all-targets`) was VERIFIED green on stable-msvc 2026-09-18.
          EOF
          # The SECOND hand-maintained list, and it exists because "covered" and "refused" are not
          # the only two states a leg has. A crate whose lib builds on this runner but whose EXAMPLE
          # does not is not a platform refusal; refusing it hides every gated item in the lib, which
          # is this job's own failure mode. Such a leg gets a narrower TARGET SET here instead.
          # A row naming something that is not a derived leg fails the step, exactly like a stale
          # refusal: an override that outlives its subject is a coverage claim nobody re-reads.
          cat > feature-scopes.txt <<'EOF'
          boyko-render/hwrt|--lib --tests|MEASURED 2026-09-18 on `--target x86_64-unknown-linux-gnu`, from a clean `cargo clean -p boyko-render`: `--lib --tests` exits 0 in 10.8 s, while `--all-targets` on DEFAULT features gives exactly ONE `error[E0601]` -- `main` function not found in `examples/orbit_cube_window.rs`, which is `#![cfg(windows)]` by construction. RE-MEASURED 2026-09-18 with `--keep-going`: still that one error, so no second failing target hides behind the first. Dropping that one example brings 34 `#[cfg(feature = "hwrt")]` sites under `crates/boyko_render/src` into a build for the first time.
          boyko-render/profiling-census|--lib --tests|same crate, same one Windows-only example. MEASURED 2026-09-18: `--lib --tests` on the linux triple exits 0 in 12.9 s.
          boyko-render/test-readback|--lib --tests|same crate, same one Windows-only example. MEASURED 2026-09-18: `--lib --tests` on the linux triple exits 0 in 10.5 s. This leg adds NO coverage of its own, and says so rather than padding the count: `boyko-render`'s self-referential dev-dependency turns `test-readback` on whenever test targets build, so any `--tests` build already compiles the gated items -- measured, this leg was FRESH in 0.19 s, reusing the units of an earlier default `--all-targets` build. It stays because it is derived, and refusing a feature that compiles would be the opposite error.
          EOF
          python3 - <<'PY'
          import json, subprocess, sys

          done = subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True,
          )
          if done.returncode != 0:
              sys.stderr.write(done.stderr.decode("utf-8", "replace"))
              sys.exit("::error::cargo metadata failed; the leg set cannot be derived")
          meta = json.loads(done.stdout)

          # `default` is not a leg: every other job in this file already compiles it.
          declared = {
              (pkg["name"], feat)
              for pkg in meta["packages"]
              for feat in pkg["features"]
              if feat != "default"
          }

          def read_table(path, fields):
              """Parse `pkg/feature|col|...` rows into {(pkg, feat): (col, ...)}."""
              rows = {}
              with open(path, encoding="utf-8") as handle:
                  for line in handle:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      parts = line.split("|", fields)
                      if len(parts) != fields + 1:
                          sys.exit(f"::error::{path}: row {parts[0]!r} has {len(parts) - 1} "
                                   f"`|`-separated columns, expected {fields}.")
                      pkg, _, feat = parts[0].partition("/")
                      rows[(pkg, feat)] = tuple(parts[1:])
              return rows

          refused = {key: cols[0] for key, cols in read_table("feature-refusals.txt", 1).items()}

          stale = sorted(key for key in refused if key not in declared)
          if stale:
              for pkg, feat in stale:
                  print(f"::error::feature-refusals.txt refuses {pkg}/{feat}, which no manifest "
                        f"declares any more -- delete the row.")
              sys.exit(1)

          legs = sorted(declared - set(refused))

          # The scope table is checked against the DERIVED leg set, not against `declared`: a row for
          # a refused feature would silently do nothing, which is the same dead-claim defect as a
          # stale refusal and is caught here the same way.
          scopes = read_table("feature-scopes.txt", 2)
          orphan = sorted(key for key in scopes if key not in set(legs))
          if orphan:
              for pkg, feat in orphan:
                  print(f"::error::feature-scopes.txt narrows {pkg}/{feat}, which is not a derived "
                        f"leg (undeclared, or refused outright) -- delete the row.")
              sys.exit(1)

          # A floor in the shape the `loom` job uses: it cannot stop the leg set from shrinking, it
          # makes a shrink an EDIT someone has to justify. 15 is the count measured on 2026-09-18
          # (23 non-default features across 11 packages, minus the 8 refusals above). It was 12
          # until the false `boyko-render` platform refusal was re-measured and withdrawn.
          MIN_LEGS = 15
          print(f"[feature census] {len(declared)} non-default features declared, "
                f"{len(refused)} refused, {len(legs)} legs to run "
                f"({len(scopes)} of them at a narrowed target scope)")
          for pkg, feat in legs:
              scope, reason = scopes.get((pkg, feat), ("--all-targets", ""))
              note = f" -- scoped: {reason}" if reason else ""
              print(f"  leg: {pkg}/{feat} [{scope}]{note}")
          for (pkg, feat), reason in sorted(refused.items()):
              print(f"  refused: {pkg}/{feat} -- {reason}")
          if len(legs) < MIN_LEGS:
              sys.exit(f"::error::only {len(legs)} legs derived, floor is {MIN_LEGS}. A feature was "
                       f"deleted or newly refused; both are fine, and both are an edit to this "
                       f"number with a reason in the commit message.")

          with open("feature-legs.txt", "w", encoding="utf-8") as handle:
              for pkg, feat in legs:
                  scope = scopes.get((pkg, feat), ("--all-targets", ""))[0]
                  handle.write(f"{pkg} {feat} {scope}\n")
          PY
      # Every leg runs even after one fails, for the reason `CLAUDE.md` gives `--no-fail-fast`: one
      # red leg must not shadow the legs ordered behind it. The executed count is compared against
      # the derived count because a `while read` over an empty file runs nothing and exits 0 — the
      # vacuous green this file already guards against in four other places.
      - name: cargo check each derived leg
        shell: bash
        run: |
          expected=$(wc -l < feature-legs.txt)
          ran=0
          failed=0
          while read -r pkg feat scope; do
            echo "::group::cargo check --locked -p $pkg --features $feat $scope"
            # `$scope` is deliberately unquoted: it carries cargo's target-selection flags as
            # SEPARATE words (`--lib --tests`), and quoting would hand cargo one argument spelled
            # "--lib --tests", which it rejects. Its content is the scope table above, not input.
            # shellcheck disable=SC2086
            if cargo check --locked -p "$pkg" --features "$feat" $scope; then
              echo "ok: $pkg/$feat"
            else
              echo "::error::$pkg/$feat does not compile -- a feature-gated item is compiled by this job and by nothing else in CI, so nothing else will say so."
              failed=$((failed + 1))
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done < feature-legs.txt
          echo "feature legs: $ran of $expected ran, $failed failed"
          if [ "$ran" -eq 0 ] || [ "$ran" -ne "$expected" ]; then
            echo "::error::feature legs ran $ran of an expected $expected -- a run that checks no feature at all exits 0, which is what this comparison forbids."
            exit 1
          fi
          # `exit "$failed"` rather than `exit 1` was the first form here, and it is a vacuous green
          # waiting to happen: a shell exit status is taken mod 256, so 256 failing legs would exit 0.
          # The count is already printed above; the status only has to be non-zero.
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  bench-compile:
    name: cargo bench --no-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked --workspace --no-run --exclude boyko_demo

  force-alloc-panic:
    name: cargo test --release (force_alloc_panic)
    runs-on: ubuntu-latest
    env:
      # Phase 9 Wave 7 Step 24 (Round 3 O-NEW-1): escalate ALLOC1 to a
      # release-mode panic. Catches any regression that accidentally
      # allocates from `Arena` inside a System body. See
      # docs/PHASE-9-FORCE-ALLOC-PANIC.md.
      # Carries `-C target-cpu=x86-64-v3` because this env REPLACES the top-level one; see
      # the note on that value. Without it this job would silently test a scalar-fallback
      # engine, which is not the engine being shipped.
      RUSTFLAGS: "--cfg force_alloc_panic -D warnings -C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-targets --release --features boyko-ecs/profiling-analysis --exclude boyko_demo --exclude bench-bevy-vs-boyko

  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Phase 3a (Miri retag fix + EntityId leak guard) closed the pre-existing UB.
    # continue-on-error removed: Miri is now a required gate.
    # MIRIFLAGS=-Zmiri-tree-borrows is set in .cargo/config.toml (workspace-wide)
    # because Tree Borrows (TB) correctly models *const Arena raw provenance with
    # UnsafeCell interior mutation — Stacked Borrows (SB) falsely rejects it.
    # Miri retag UB (Step 1) + EntityId leak (Step 4) jointly close Phase 3a.
    # continue-on-error removed from .github/workflows/ci.yml as per Phase 3a plan.
    #
    # This job deliberately does NOT carry `-C target-cpu=x86-64-v3`, unlike every other
    # job. Miri interprets MIR rather than executing machine code, so the ISA baseline buys
    # it nothing and would only ask the interpreter to model vector intrinsics. It hides no
    # coverage: every `cfg(target_feature = "avx2")` site in the workspace is in
    # `boyko_physics` (`solver/simd.rs`, `sdf_simd.rs`, `lib.rs`), and this job runs only
    # `boyko-ecs` targets, which contain none. If a Miri step is ever pointed at
    # `boyko_physics`, add the flag here and expect the AVX2 kernels to need intrinsic
    # support from the interpreter.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: cargo miri test (event_attribute — known clean)
        run: cargo +nightly miri test --locked --package boyko-ecs --test event_attribute
      - name: cargo miri test (drop_fn — known clean)
        run: cargo +nightly miri test --locked --package boyko-ecs --test drop_fn
      # PC-24: the world-retag matrix (`unsafe_ecs_cell.rs`, `pc24_` tests) under STACKED Borrows.
      # Every other Miri step runs Tree Borrows through `.cargo/config.toml`'s `[env]`, and TB is
      # blind to a worker-side `&mut` over the world that only reads (TB: retag read vs retag read).
      # An explicitly set MIRIFLAGS wins over `[env]` unless that entry is `force`d, so the step
      # prints the flags and REDs on a forced entry rather than silently running TB. The matrix is
      # pool-free on purpose: crossbeam-epoch's own SB violation ends a pool-backed SB run first.
      - name: cargo miri test (PC-24 world-retag matrix — Stacked Borrows leg)
        shell: bash
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"
        run: |
          echo "MIRIFLAGS=$MIRIFLAGS"
          if sed -n '/^\[env\]/,/^\[/p' .cargo/config.toml | grep -qE '^\s*MIRIFLAGS\s*=\s*\{.*force\s*=\s*true'; then
            echo "RED: [env] MIRIFLAGS is forced; this step would silently run Tree Borrows"; exit 1; fi
          cargo +nightly miri test --locked -p boyko-ecs --lib -- pc24_ 2>&1 | tee pc24_sb.log
          grep -q 'running 7 tests' pc24_sb.log && grep -q 'test result: ok. 7 passed; 0 failed' pc24_sb.log
      # 2026-07 audit: this step's `--all-targets` was the vacuous root-package form (it
      # interpreted nothing). Miri CANNOT execute FFI calls, so a literal workspace sweep
      # would fault the instant it reached `boyko_rhi_vulkan`'s raw `vk*` calls (and the
      # crates that depend on it) — the sweep is therefore scoped EXPLICITLY to the
      # pure-compute crates, which is what it could ever have meaningfully covered.
      # The FFI/GPU side is covered instead by `cargo careful` + the validation-layer
      # golden runs (docs/AUDIT-2026-07-PLAN.md's tool matrix).
      # Reflection GATES G4 item 3 / D4: TWO reflect rows with DIFFERENT shapes, and the
      # difference is the point. `-p boyko-reflect` is PLAIN — the crate carries no
      # `reflect` feature (D4) and never will, so `--features reflect` on it is a hard
      # cargo error ("none of the selected packages contains these features"); and with
      # the feature "off" it is NOT empty — nothing in its source is cfg-gated. That row
      # covers the arithmetic and the registry. `-p reflect-fixture` carries the
      # `pkg/feature` spelling — the ONLY row that reaches any derive-generated unsafe,
      # because only a consumer can hold a `#[component(reflect)]` type (B.9).
      # `reflect-dogfood` is deliberately ABSENT: it reaches boyko_render ->
      # boyko_rhi_vulkan, and Miri cannot execute FFI — which is why this sweep is
      # hand-listed at all (F18). The fixture's census/codegen harnesses carry
      # `#[cfg(not(miri))]`: Miri cannot spawn processes either, and without the guard
      # this row reds for a reason that has nothing to do with reflection.
      - name: cargo miri test (pure-compute sweep)
        run: |
          cargo +nightly miri test --locked --all-targets \
            -p boyko-ecs -p boyko-utils -p boyko-threadpool -p boyko-serialize \
            -p boyko-math -p boyko_sdf_math -p boyko_image \
            -p boyko-reflect \
            -p reflect-fixture --features reflect-fixture/reflect

  # ---------------------------------------------------------------------------------------------
  # loom — the permutation checker for the pool's wake protocol
  # ---------------------------------------------------------------------------------------------
  #
  # `crates/boyko_threadpool/tests/loom_pool.rs` is where the pool's no-lost-wakeup property is
  # PROVED rather than sampled: loom re-runs each model over every thread interleaving and every
  # memory-model outcome its preemption bound admits, so a wake that is lost on one interleaving in
  # a million — or only on a weakly-ordered CPU, never on x86 — is found by construction. Ordinary
  # tests cannot establish that property at all. The whole file is `#![cfg(loom)]`, so a build
  # WITHOUT `--cfg loom` links a test binary containing zero models; that is the exact vacuity this
  # job's gate exists to make impossible (see the step's comment).
  #
  # WHY THIS JOB EXISTS: the models could not be run on the KE16 bench box for most of that
  # campaign — every `--cfg loom` binary there died with STATUS_ACCESS_VIOLATION before `main`,
  # even for `--help`. MEASURED 2026-09-02, that was never loom's fault and never `--cfg loom`'s:
  # the `RUSTFLAGS` environment variable REPLACES `target.<triple>.rustflags` (the same rule the
  # top-level `env:` block explains at length), and on that machine those config flags carry a
  # `-Clink-arg=-B<lld>` that routes the mingw link through LLD. Spelling the loom flag as a bare
  # `RUSTFLAGS="--cfg loom"` discarded it, binutils `ld` 2.42 then emitted a truncated import
  # directory for the raw-dylib `kernel32.dll` descriptor that `generator` (loom's stack-switching
  # dependency) needs — 4 symbols where LLD writes 40+, with `VirtualAlloc`, `VirtualProtect`,
  # `GetSystemInfo` and `AddVectoredExceptionHandler` left unbound — and the mingw startup
  # relocator faulted on them. Restoring that one flag makes every model build and pass locally, in
  # both profiles. None of it applies to `ubuntu-latest`; this job is the durable, machine-
  # independent home for the models regardless of what any developer box does to its linker.
  #
  # RUSTFLAGS: this job needs its own, and because the variable REPLACES rather than appends it has
  # to repeat everything the tree relies on.
  #   * `-D warnings` — repeated for the reason every other job repeats it. VERIFIED locally: the
  #     crate and all six models compile clean under `--cfg loom -D warnings` (re-verified
  #     2026-09-23, B3, when the sixth model joined the job).
  #   * `-C target-cpu=x86-64-v3` — KEPT, unlike the `miri` job just above. Miri opts out because it
  #     interprets MIR and never executes machine code, so the ISA buys it nothing; this job
  #     executes a real binary, so the ISA baseline is a real property of the artifact under test.
  #     It hides no coverage either way — `boyko_threadpool` contains no `cfg(target_feature)` arm,
  #     every one in the workspace being in `boyko_physics` — but carrying it is what the top-level
  #     note requires of any job that defines its own RUSTFLAGS, and it costs nothing here.
  #
  # PROFILE: release. Both profiles were built and run locally and both pass; release is ~4.8x
  # faster on the models as they stand (0.96 s vs 4.63 s of model time) and is the profile the
  # design's own invocation uses (`docs/threadpool/KE16-DESIGN-MEASUREMENT.md:388`). The engine's
  # older note that "loom release binaries crash at startup" was the linker defect described above,
  # not a property of the profile: release was re-verified green once the link flag was restored.
  #
  # LOOM_MAX_PREEMPTIONS=3 is the bound `docs/threadpool/KE16-DESIGN.md` §8 (the W-b row) and
  # `KE16-DESIGN-MEASUREMENT.md:388` both specify. Measured wall time for the five models at that
  # bound, release, on the bench box: ~1 s of model time after a ~75 s cold build (a 2026-09-02
  # reading, taken before the sixth model joined).
  loom:
    name: loom (threadpool wake protocol)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom -D warnings -C target-cpu=x86-64-v3"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      # THE SIX MODEL NAMES ARE WRITTEN OUT **AND** THE COUNT IS PINNED, because neither half is
      # sufficient on its own. Both vacuous forms were probed on 2026-09-02 and BOTH EXIT 0:
      #   * built without `--cfg loom`, the harness prints `running 0 tests` and cargo exits 0;
      #   * with one name in the `--exact` list renamed, the harness prints `running 4 tests` and
      #     `1 filtered out`, and cargo STILL exits 0.
      # So the run's own status is checked first, and then the two harness lines are pinned
      # verbatim. `0 filtered out` is part of the pin deliberately: it goes red if the `--exact`
      # list and the compiled model set stop being the same set, in EITHER direction.
      #
      # WHERE THE SIX CAME FROM: they are every `#[test]` in `tests/loom_pool.rs`, read off
      # `loom_pool --list` on 2026-09-23 (B3). On 2026-09-02 the list held five: every model then
      # not behind a KE16 tournament feature (`ke16-a5`, `ke16-w-gate`, `ke16-w-count`), kept out
      # because `KE16-DESIGN.md` §4 deletes those switches once the verdict lands, and a permanent
      # gate keyed to a temporary feature breaks on the commit that removes it. The verdict landed
      # and Step App removed the features; the file's one surviving gated model,
      # `loom_m1c_count_gated_completion_wakes_the_parked_worker_joiner`, is now unconditional. A
      # default build therefore compiled six models while this job named five, and `0 filtered out`
      # would have failed on the first run. The sixth is named here for that reason.
      #
      # ADDING A MODEL: add its name to the list AND bump both `6`s. Forgetting is not silent — an
      # unlisted new model shows up as `1 filtered out`, and a listed one moves `running 6 tests` to
      # `running 7 tests`; either way the pin fails. That friction IS the gate: it is what makes
      # this job unable to pass while measuring nothing.
      - name: cargo test --release --test loom_pool (6 models, count-pinned)
        shell: bash
        run: |
          set +e
          cargo test --locked --release -p boyko-threadpool --test loom_pool -- \
            --test-threads=1 --exact \
            loom_m1_fork_join_no_lost_wakeup \
            loom_m2_idle_race_c_no_lost_wakeup \
            loom_m2_calibration_no_producer_fence_is_lost \
            loom_m2b_idle_cas_contention_exactly_one \
            loom_m3_shutdown_handshake_worker_exits \
            loom_m1c_count_gated_completion_wakes_the_parked_worker_joiner \
            > loom.log 2>&1
          status=$?
          set -e
          cat loom.log
          if [ "$status" -ne 0 ]; then
            echo "::error::loom models failed (cargo exit $status)"
            exit "$status"
          fi
          if ! grep -qx "running 6 tests" loom.log; then
            echo "::error::loom ran the wrong number of models -- expected the line 'running 6 tests'. A run that compiles the models and executes none exits 0; this is the check that forbids it."
            exit 1
          fi
          if ! grep -q "^test result: ok\. 6 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out" loom.log; then
            echo "::error::loom summary line did not match '6 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' -- a model was ignored, filtered, or added without updating this job."
            exit 1
          fi
          echo "loom: 6 models executed and passed at LOOM_MAX_PREEMPTIONS=$LOOM_MAX_PREEMPTIONS"
