name: CI

on:
  push:
    branches: [master, ecs]
  pull_request:
    branches: [master, ecs]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# 2026-07 audit, P0 build-gate finding: EVERY job below used to run a bare
# `cargo <cmd> --all-targets`. This workspace root is ALSO a package (`boyko-engine`,
# the `src/main.rs` placeholder binary), so Cargo's default selection at the root was
# THAT PACKAGE ALONE — the jobs compiled a `println!` in ~0.2 s and reported success
# while every engine crate went unchecked. The root cause is fixed in `Cargo.toml`
# (`default-members` now lists every member), and each job below ALSO says
# `--workspace` explicitly so the intent survives a future manifest edit.
#
# The `boyko_demo` / `bench_bevy_vs_boyko` exclusions mirror `docs.yml`'s own
# proven-on-this-runner set (eframe/wgpu and bevy are heavy third-party trees, not
# engine surface); `bench-compile` deliberately KEEPS `bench_bevy_vs_boyko` — compiling
# that crate's benches is the whole point of that job.
jobs:
  # The suppression half of the hot-path type ban. `clippy.toml` + the denied
  # `[workspace.lints.clippy] disallowed_types` stop a NEW `HashMap`/`Mutex`/`RefCell` from
  # compiling, but clippy cannot police its own `#[allow]`s — and an `#[allow]` on a `mod`
  # silences the ban for a whole subtree invisibly (measured 2026-07). This job forbids blanket
  # suppression in production code and requires every remaining exception to carry a row in
  # docs/HOT-PATH-EXCEPTIONS.md with a frequency class from a closed vocabulary of cold classes.
  hot-path-exceptions:
    name: hot-path exception registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_hotpath_exceptions.py

  # docs/diagnostics/ is a 22-file design corpus carved out of two plans that were each reviewed
  # twice and passed, and which the first reader to hold them side by side found asserting
  # CONTRADICTORY facts about the same object. Splitting them makes each piece reviewable and makes
  # that failure more likely, not less — two documents can disagree in one way, twenty-two in many.
  # Every file declares what it provides and assumes; this job walks the resulting graph so the
  # question "do these documents agree?" stops needing a reviewer who has read all of them at once.
  # The script exits 1 rather than passing quietly when the corpus is absent: a green gate with no
  # subject is the failure mode this campaign has caught nine times.
  doc-contracts:
    name: diagnostics corpus contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_doc_contracts.py

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --exclude boyko_demo --exclude bench-bevy-vs-boyko

  test:
    name: cargo test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (${{ matrix.profile }})
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo test --workspace --all-targets --release --exclude boyko_demo --exclude bench-bevy-vs-boyko
          else
            cargo test --workspace --all-targets --exclude boyko_demo --exclude bench-bevy-vs-boyko
          fi

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # Phase 5a cleared boyko_utils (13 warnings); Phase 5d cleared boyko_ecs
        # (~43 warnings). Workspace is now clean: no || true workaround needed.
        run: cargo clippy --workspace --all-targets --exclude boyko_demo --exclude bench-bevy-vs-boyko -- -D warnings

  bench-compile:
    name: cargo bench --no-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run --exclude boyko_demo

  force-alloc-panic:
    name: cargo test --release (force_alloc_panic)
    runs-on: ubuntu-latest
    env:
      # Phase 9 Wave 7 Step 24 (Round 3 O-NEW-1): escalate ALLOC1 to a
      # release-mode panic. Catches any regression that accidentally
      # allocates from `Arena` inside a System body. See
      # docs/PHASE-9-FORCE-ALLOC-PANIC.md.
      RUSTFLAGS: "--cfg force_alloc_panic -D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --release --exclude boyko_demo --exclude bench-bevy-vs-boyko

  miri:
    name: Miri
    runs-on: ubuntu-latest
    # Phase 3a (Miri retag fix + EntityId leak guard) closed the pre-existing UB.
    # continue-on-error removed: Miri is now a required gate.
    # MIRIFLAGS=-Zmiri-tree-borrows is set in .cargo/config.toml (workspace-wide)
    # because Tree Borrows (TB) correctly models *const Arena raw provenance with
    # UnsafeCell interior mutation — Stacked Borrows (SB) falsely rejects it.
    # Miri retag UB (Step 1) + EntityId leak (Step 4) jointly close Phase 3a.
    # continue-on-error removed from .github/workflows/ci.yml as per Phase 3a plan.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: cargo miri test (event_attribute — known clean)
        run: cargo +nightly miri test --package boyko-ecs --test event_attribute
      - name: cargo miri test (drop_fn — known clean)
        run: cargo +nightly miri test --package boyko-ecs --test drop_fn
      # 2026-07 audit: this step's `--all-targets` was the vacuous root-package form (it
      # interpreted nothing). Miri CANNOT execute FFI calls, so a literal workspace sweep
      # would fault the instant it reached `boyko_rhi_vulkan`'s raw `vk*` calls (and the
      # crates that depend on it) — the sweep is therefore scoped EXPLICITLY to the
      # pure-compute crates, which is what it could ever have meaningfully covered.
      # The FFI/GPU side is covered instead by `cargo careful` + the validation-layer
      # golden runs (docs/AUDIT-2026-07-PLAN.md's tool matrix).
      - name: cargo miri test (pure-compute sweep)
        run: |
          cargo +nightly miri test --all-targets \
            -p boyko-ecs -p boyko-utils -p boyko-threadpool -p boyko-serialize \
            -p boyko-math -p boyko_sdf_math -p boyko_image
