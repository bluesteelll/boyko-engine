name: Deploy Documentation

on:
  push:
    branches: [master, ecs]
  pull_request:
    branches: [master, ecs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: '0.4.40'
  MDBOOK_MERMAID_VERSION: '0.14.0'

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      - name: Install mdBook and preprocessors
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify mdBook
        run: |
          mdbook --version
          mdbook-mermaid --version

      - name: Build mdBook
        run: mdbook build

      - name: Build cargo doc
        env:
          # --enable-index-page / -Z unstable-options are nightly-only and break the
          # stable toolchain used above. The /api/ landing page is produced by the
          # manual redirect in "Assemble site", so the index page is not needed here.
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --all-features

      - name: Assemble site
        run: |
          mkdir -p _site
          # mdBook output → root
          cp -r book/output/* _site/
          # cargo doc → /api/
          mkdir -p _site/api
          cp -r target/doc/* _site/api/
          # Index redirect for /api/ to main crate
          cat > _site/api/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Boyko Engine API</title>
            <meta http-equiv="refresh" content="0; url=boyko_ecs/index.html">
            <link rel="canonical" href="boyko_ecs/index.html">
          </head>
          <body>
            <p>Redirecting to <a href="boyko_ecs/index.html">boyko_ecs</a>...</p>
          </body>
          </html>
          EOF
          # Ensure GitHub Pages serves correctly
          touch _site/.nojekyll

      # ── boyko_demo web build (Wave 7, plan §8.2 / §10 W7.3) ─────────────────
      # ADDITIVE: builds the wasm demo with Trunk and folds dist/ into the same
      # Pages artifact under /demo/. The mdBook + rustdoc deploy above is already
      # assembled into _site/ at this point, so these steps only ADD to it.
      #
      # NON-FATAL by design (continue-on-error: true on the build step). As of
      # Wave 7 the wasm build is blocked UPSTREAM in `boyko_ecs` (out of scope
      # here): ~19 hard-coded 64-bit `const _: () = assert!(size_of/align_of/
      # offset_of ...)` layout guards (EntityInland, Column, Commands,
      # EventReader/Writer, ...) fail const-eval on the 32-bit wasm32 ABI. Until
      # those asserts are made pointer-width-aware in the core, `trunk build`
      # fails — but it MUST NOT take down the docs deploy. So the step is
      # `continue-on-error`, and the publish step below only copies dist/ if it
      # was actually produced. See docs/DEMO-DOGFOODING.md (Wave-7 finding).
      - name: Add wasm target
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
        run: rustup target add wasm32-unknown-unknown

      - name: Install Trunk
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Build boyko_demo (wasm, non-fatal until the core layout asserts are pointer-width-aware)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
        id: build_demo
        continue-on-error: true
        working-directory: crates/boyko_demo
        # The demo's .cargo/config.toml (discovered from this dir) sets
        # `--cfg getrandom_backend="wasm_js"`, required by getrandom 0.3 on wasm.
        # `--public-url /boyko-engine/demo/` matches the Pages project subpath so
        # the generated asset URLs resolve under the deployed /demo/ path.
        run: trunk build --release --public-url /boyko-engine/demo/

      - name: Publish boyko_demo to /demo/ (only if the wasm build succeeded)
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs') && steps.build_demo.outcome == 'success'
        run: |
          mkdir -p _site/demo
          cp -r crates/boyko_demo/dist/* _site/demo/

      - name: Setup Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ecs'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
