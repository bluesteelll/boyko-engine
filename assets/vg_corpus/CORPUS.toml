# ---------------------------------------------------------------------------------------------
# MEASURED 2026-07-31, in three rounds, and every round corrected the one before it. All three are
# kept, because what went stale is as instructive as what is true now.
#
# ROUND 1 found that every genuinely high-poly sample asset is multi-primitive or hierarchical,
# so the decoder's "exactly one mesh, one primitive" rule capped this corpus at ~18 k triangles --
# three orders of magnitude below the regime K1 is about. Real content splits primitives BY
# MATERIAL and groups them under nodes; the rule selected for toy assets.
#
# ROUND 2 concatenated primitives and root nodes. ROUND 3 composed hierarchies too, on the
# argument that a parent transform multiplied into a child's still yields the geometry THIS FILE
# describes, in its own space -- placing assets relative to ONE ANOTHER is the census's job, and
# the decoder never does it. What stays refused is a graph that reaches one node twice, since this
# decoder emits each mesh exactly once.
#
# ⚠️ ROUND 3 ALSO EXPOSED A WRONG NUMBER IN THIS FILE. `a_beautiful_game` was recorded at 573 952
# triangles -- the sum over UNIQUE meshes -- while the decoder produced 1 499 072, because the
# scene INSTANCES those meshes (a chess set: many pieces, few distinct meshes). The rendered total
# is 2.6x the unique total, and the rendered total is what a density census sees. The field now
# carries the instance-weighted count. Any future entry must be counted the same way, or R0b(b)'s
# equality reds for a reason that has nothing to do with the decoder.
#
#   a_beautiful_game   1 499 072 tris   hierarchy + instancing   ACCEPTED since Rev 39
#   metal_rough_spheres  501 776 tris   hierarchy                ACCEPTED since Rev 39
#   dragon_attenuation   134 995 tris   2 meshes                 ACCEPTED since Rev 38
#   toy_car              108 936 tris   3 meshes                 ACCEPTED since Rev 38
#   corset                18 324 tris   1 mesh
#   damaged_helmet        15 452 tris   1 mesh
#   avocado                  682 tris   1 mesh
#
# CORPUS TOTAL: 2 279 237 triangles across seven assets -- into the multi-million-triangle regime
# the premise is about, from 682 at the start of the day. R0b(b)'s equality (decoded == published)
# holds on all seven and is what keeps each addition honest.
