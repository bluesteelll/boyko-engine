# ---------------------------------------------------------------------------------------------
# MEASURED 2026-07-31: WHAT NOW BLOCKS A HIGH-POLY CORPUS, and it is no longer the node transform.
#
# Fifteen candidates were probed for triangle count AND subset compliance. Every genuinely
# high-poly one is MULTI-PRIMITIVE, which this decoder refuses:
#
#   ABeautifulGame     573 952 tris   15 meshes / 15 prims / hierarchy   REFUSED
#   MetalRoughSpheres  501 776 tris    5 meshes /  5 prims / hierarchy   REFUSED
#   DragonAttenuation  134 995 tris    2 meshes /  2 prims              REFUSED
#   ToyCar             108 936 tris    3 meshes /  3 prims              REFUSED
#   AntiqueCamera       20 066 tris    2 meshes /  2 prims              REFUSED
#   corset              18 324 tris    1 mesh   /  1 prim               ACCEPTED  <- the largest
#   damaged_helmet      15 452 tris    1 mesh   /  1 prim               ACCEPTED
#
# The pattern is structural, not incidental: real content splits primitives BY MATERIAL, so
# "exactly one primitive" selects for toy assets. The ceiling on this corpus is therefore ~18 k
# triangles, three orders of magnitude below the regime K1 is about.
#
# THE DECISION THIS FORCES, recorded rather than taken in a hurry -- the last time a §3.3
# restriction was authored without running it against real content, it refused every real asset:
# concatenating a file's primitives into one MeshData is arguably still DECODING (the census
# measures triangles per covered pixel, and per-primitive material identity is not an input to it),
# whereas flattening a NODE HIERARCHY places instances relative to one another and is scene
# assembly. Those two are not the same act, and Rev 33 conflated them once already. Whichever way
# it goes must be derived, and R0b(b)'s equality (decoded == published, summed over primitives) is
# what keeps it honest.

