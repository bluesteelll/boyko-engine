[package]
name = "boyko-ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
boyko-utils =  { path = "../boyko_utils" }
boyko-threadpool = { path = "../boyko_threadpool" }
fixedbitset = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
# Phase 12.5 Opt-A2: SBO-SEND1 / SBO-UNPIN pin-down via compile-time
# `assert_impl_all!` in `commands/spawn_batch_command.rs` and
# `bundle/bundle_column_cache.rs`. Production build asserts (not
# `#[cfg(test)]`) per I-N5.
static_assertions = "1.1"

# Phase X.E — optional bench-only global allocator, gated behind the
# `bench-alloc` feature (OFF by default). Cargo forbids `optional = true` on
# dev-dependencies, so the bench allocator lives here as a normal optional
# dependency; because nothing enables `bench-alloc` by default, it is NEVER
# compiled in the default build/test/bench graph. Enabled via
# `cargo bench --features bench-alloc`. See docs/BENCHMARKING.md.
mimalloc = { version = "0.1", optional = true }

# Phase X.C — arena lazy-commit backing store. The Unix arm of
# `Arena::with_capacity` / `Drop` calls `mmap` / `munmap` via `libc`. Already
# present in Cargo.lock at 0.2.x (transitively), so this unifies with zero new
# compilation. Not pulled in on Windows/wasm32 (the cfg-gated arms there use
# `VirtualAlloc` / the global allocator).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Phase 12.5 Track B I5 — bumps `MAX_QUERY_TYPES` from 1024 to 4096 for
# projects with an unusually high fan-out of `(D, F)` query shapes. Increases
# the per-world `query_state_cache` footprint from ≤ 32 KB to ≤ 128 KB.
big_query_table = []
# Phase X.E — opt-in low-variance bench allocator. OFF by default so the normal
# `cargo bench` keeps the production system heap (honest absolutes); enable via
# `cargo bench --features bench-alloc` to swap in mimalloc for A/B signal
# extraction. See docs/BENCHMARKING.md.
bench-alloc = ["dep:mimalloc"]

[dev-dependencies]
boyko-macros = { path = "../boyko_macros" }
trybuild = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# `rand` is used only by tests/benches (the single `src/` reference is inside a
# `#[cfg(test)] mod tests` in `schedule/bitset_intersects.rs`), so it lives in
# dev-dependencies. This keeps its `getrandom` dependency out of the normal
# `wasm32-unknown-unknown` build (the web-demo target), where getrandom 0.3
# otherwise requires an explicit backend flag.
rand = "0.9.0"

[[bench]]
name = "component_id"
harness = false

[[bench]]
name = "swap_remove"
harness = false

# Phase X.B — dense Vec<Unit>-elimination pool micro-benchmarks (add fill /
# swap_remove / get_raw row_ptr recompute), isolated from EcsMaster setup noise.
[[bench]]
name = "component_pool_dense"
harness = false

[[bench]]
name = "query_iter"
harness = false

[[bench]]
name = "allocator"
harness = false

# Phase X.C — cold-construction gate (Arena::new / EcsMaster::new <= 5 µs).
[[bench]]
name = "arena_new"
harness = false

[[bench]]
name = "archetype"
harness = false

# Phase X.I — XI-B2 archetype-creation gate (create_by_ids <= 25 us; pools
# are reserve-only post-X.I). See docs/PHASE-XI-PLAN.md §Metrics.
[[bench]]
name = "archetype_create"
harness = false

# Phase X.I — XI-B4 growth-event gate (one grow_rows commit step at
# 64 KiB / 2 MiB / 64 MiB <= 10 / 10 / 50 us). Gate figures are the printed
# `pool_grow_event[...]` lines. See docs/PHASE-XI-PLAN.md §Metrics.
[[bench]]
name = "pool_grow_event"
harness = false

[[bench]]
name = "event_dispatch"
harness = false

[[bench]]
name = "random_access"
harness = false

[[bench]]
name = "system_param"
harness = false

[[bench]]
name = "query_dsl"
harness = false

[[bench]]
name = "phase8cd"
harness = false

[[bench]]
name = "bundle_static_cache"
harness = false

[[bench]]
name = "phase9_scheduler"
harness = false

[[bench]]
name = "phase10_change_detection"
harness = false

[[bench]]
name = "phase12_5_spawn_batch"
harness = false

[[bench]]
name = "phase14a_hooks_gate"
harness = false

[[bench]]
name = "phase17_states"
harness = false

[[bench]]
name = "phase18_app"
harness = false

# Phase 20 — App frame-driver overhead gates: P20-B1(b) empty-frame envelope
# (empty_main <= 250 ns/frame) + P20-B2 substep overhead (fixed_loop_1_substep
# minus bare_empty_schedule_run minus the (b) envelope <= 100 ns/substep).
# See docs/PHASE-20-PLAN.md §Metrics.
[[bench]]
name = "app_overhead"
harness = false

[lints.rust]
# Phase 9 Wave 7 Step 24: opt-in stronger ALLOC1 check via
# `RUSTFLAGS="--cfg force_alloc_panic"`. See
# docs/PHASE-9-FORCE-ALLOC-PANIC.md.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(force_alloc_panic)'] }
