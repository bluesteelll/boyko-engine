[package]
name = "boyko-ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
boyko-utils =  { path = "../boyko_utils" }
boyko-threadpool = { path = "../boyko_threadpool" }
fixedbitset = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
# Phase 12.5 Opt-A2: SBO-SEND1 / SBO-UNPIN pin-down via compile-time
# `assert_impl_all!` in `commands/spawn_batch_command.rs` and
# `bundle/bundle_column_cache.rs`. Production build asserts (not
# `#[cfg(test)]`) per I-N5.
static_assertions = "1.1"

# Phase X.C — arena lazy-commit backing store. The Unix arm of
# `Arena::with_capacity` / `Drop` calls `mmap` / `munmap` via `libc`. Already
# present in Cargo.lock at 0.2.x (transitively), so this unifies with zero new
# compilation. Not pulled in on Windows/wasm32 (the cfg-gated arms there use
# `VirtualAlloc` / the global allocator).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Phase 12.5 Track B I5 — bumps `MAX_QUERY_TYPES` from 1024 to 4096 for
# projects with an unusually high fan-out of `(D, F)` query shapes. Increases
# the per-world `query_state_cache` footprint from ≤ 32 KB to ≤ 128 KB.
big_query_table = []

[dev-dependencies]
boyko-macros = { path = "../boyko_macros" }
trybuild = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
# `rand` is used only by tests/benches (the single `src/` reference is inside a
# `#[cfg(test)] mod tests` in `schedule/bitset_intersects.rs`), so it lives in
# dev-dependencies. This keeps its `getrandom` dependency out of the normal
# `wasm32-unknown-unknown` build (the web-demo target), where getrandom 0.3
# otherwise requires an explicit backend flag.
rand = "0.9.0"

[[bench]]
name = "component_id"
harness = false

[[bench]]
name = "swap_remove"
harness = false

[[bench]]
name = "query_iter"
harness = false

[[bench]]
name = "allocator"
harness = false

# Phase X.C — cold-construction gate (Arena::new / EcsMaster::new <= 5 µs).
[[bench]]
name = "arena_new"
harness = false

[[bench]]
name = "archetype"
harness = false

[[bench]]
name = "event_dispatch"
harness = false

[[bench]]
name = "random_access"
harness = false

[[bench]]
name = "system_param"
harness = false

[[bench]]
name = "query_dsl"
harness = false

[[bench]]
name = "phase8cd"
harness = false

[[bench]]
name = "bundle_static_cache"
harness = false

[[bench]]
name = "phase9_scheduler"
harness = false

[[bench]]
name = "phase10_change_detection"
harness = false

[[bench]]
name = "phase12_5_spawn_batch"
harness = false

[[bench]]
name = "phase14a_hooks_gate"
harness = false

[[bench]]
name = "phase17_states"
harness = false

[[bench]]
name = "phase18_app"
harness = false

[lints.rust]
# Phase 9 Wave 7 Step 24: opt-in stronger ALLOC1 check via
# `RUSTFLAGS="--cfg force_alloc_panic"`. See
# docs/PHASE-9-FORCE-ALLOC-PANIC.md.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(force_alloc_panic)'] }
