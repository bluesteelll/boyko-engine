[package]
name = "boyko-ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.0"
boyko-utils =  { path = "../boyko_utils" }

[dev-dependencies]
boyko-macros = { path = "../boyko_macros" }
trybuild = "1"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "component_id"
harness = false

[[bench]]
name = "swap_remove"
harness = false

[[bench]]
name = "query_iter"
harness = false

[[bench]]
name = "allocator"
harness = false

[[bench]]
name = "archetype"
harness = false

[[bench]]
name = "event_dispatch"
harness = false

[[bench]]
name = "random_access"
harness = false

[[bench]]
name = "system_param"
harness = false

[[bench]]
name = "query_dsl"
harness = false
