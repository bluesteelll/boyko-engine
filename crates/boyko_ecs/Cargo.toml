[package]
name = "boyko-ecs"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.0"
boyko-utils =  { path = "../boyko_utils" }
anyhow = "1.0.97"

[dev-dependencies]
boyko-macros = { path = "../boyko_macros" }
trybuild = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "component_id"
harness = false

[[bench]]
name = "swap_remove"
harness = false

[[bench]]
name = "query_iter"
harness = false
