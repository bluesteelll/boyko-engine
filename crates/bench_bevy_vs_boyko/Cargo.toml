[package]
name = "bench-bevy-vs-boyko"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
boyko-ecs = { path = "../boyko_ecs" }
boyko-macros = { path = "../boyko_macros" }
boyko-threadpool = { path = "../boyko_threadpool" }
bevy_ecs = { version = "0.18.1", features = ["std", "multi_threaded"] }
# Phase X.E — optional bench-only global allocator, gated behind the
# `bench-alloc` feature (OFF by default). Cargo forbids `optional = true` on
# dev-dependencies, so the bench allocator lives here as a normal optional
# dependency; because nothing enables `bench-alloc` by default, it is NEVER
# compiled in the default build/bench graph. Enabled via
# `cargo bench --features bench-alloc`. See docs/BENCHMARKING.md.
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Opt-in flag for benches that require nightly-only intrinsics (e.g.
# `float_algebraic`). The default-toolchain `--all-targets` build leaves this
# off so it never tries to compile `#![feature(...)]` code on stable.
# Run the nightly benches via: `cargo +nightly bench --features nightly`.
nightly = []
# Phase X.E — opt-in low-variance bench allocator. OFF by default so the normal
# `cargo bench` keeps the production system heap (honest absolutes); enable via
# `cargo bench --features bench-alloc` to swap in mimalloc for A/B signal
# extraction. See docs/BENCHMARKING.md.
bench-alloc = ["dep:mimalloc"]

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "comparison_v2"
harness = false

[[bench]]
name = "profile_spawn"
harness = false

[[bench]]
name = "profile_spawn_v2"
harness = false

[[bench]]
name = "profile_query"
harness = false

[[bench]]
name = "profile_spawn_single"
harness = false

[[bench]]
name = "g6_for_each_chunk"
harness = false
# Uses `f32::algebraic_add` (`#![feature(float_algebraic)]`), so it only
# compiles on nightly with the `nightly` feature enabled. Excluded from the
# stable `--all-targets` build to keep `cargo clippy --workspace` green.
required-features = ["nightly"]
