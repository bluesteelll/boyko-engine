[package]
name = "boyko_rhi_vulkan"
version = "0.1.0"
edition = "2024"
description = "Raw hand-FFI Vulkan backend for boyko-engine (Slice 0 foundation: loader + device + VkDeviceMemory sub-allocator). std-only, no third-party crates."

# INVIOLABLE: this crate depends on `std` ONLY for FFI. No ash / vulkano /
# windows-sys / libc. The Vulkan surface is hand-declared raw FFI mirroring the
# `boyko_ecs::ecs::memory::vm.rs` discipline (`unsafe extern "system"` blocks +
# `// SAFETY:` ABI comments + `cfg(windows)`). `boyko_rhi` is the in-house,
# FFI-free RHI trait surface this backend implements (Phase 1, compute path) —
# it adds no third-party dependency.
[dependencies]
boyko_rhi = { path = "../boyko_rhi" }
# The analytic SDF field math + std430 data model (the W4 leaf-cut). A `no_std`,
# graphics-free leaf with ZERO third-party deps — does not breach the "no
# ash/vulkano/windows-sys/libc" constraint above. It is the SINGLE source of truth
# the rung-8/9/10/11 golden mirror in `compute.rs` folds and that `boyko_physics`
# (W5) reuses for CPU SDF-collision queries WITHOUT depending on this crate.
boyko_sdf_math = { path = "../boyko_sdf_math" }

# Win32 INPUT FFI (I6 / I6b) — the OFFICIAL Microsoft-maintained raw bindings,
# explicitly approved for the OS layer. SCOPE: the windowing + Raw-Input FFI ONLY
# (SetWindowLongPtrW / GetWindowLongPtrW / RegisterRawInputDevices /
# GetRawInputData + the RAWINPUT* structs + the WM_* / GWLP_USERDATA / RID_* /
# HID_* constants). `windows-sys` (NOT `windows`) is the raw, zero-overhead,
# transitive-dep-free binding layer that matches this crate's hand-FFI idiom. The
# Vulkan FFI stays 100% in-house (the INVIOLABLE no-ash/no-vulkano rule is
# untouched: this dep covers OS windowing/input, never `vk*`). Target-gated to
# `cfg(windows)` so non-Windows / wasm builds pull nothing.
# The workspace `windows-sys` pin carries the base `Win32_UI_WindowsAndMessaging`
# feature; this crate's windowing + Raw-Input FFI adds the Foundation / Raw-Input /
# HID features on top locally (Cargo unions them with the workspace base).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Devices_HumanInterfaceDevice",
] }

# Test-only. `proptest` drives the Render B1 over-relaxation soundness oracle
# (the hit-set-superset no-hole property over randomized SDF scenes — the Candidate-C
# correctness gate). It is a DEV-dependency only — the shipped backend stays third-party-free
# for the Vulkan path (the "no ash/vulkano" constraint above governs the GPU FFI,
# not the host test harness). proptest pulls only host-side, graphics-free crates.
[dev-dependencies]
proptest = "1"
# Test-only. The in-house shader eDSL, with the std `emit` codegen backend ON, so
# the `sdf_field_edsl_sync` guard can regenerate the HLSL field bodies and assert
# the committed `shaders/sdf_field.hlsli` still matches them (no by-hand drift).
# Zero third-party deps; `emit` is dev-only so the shipped backend never links it.
boyko_shaderdsl = { path = "../boyko_shaderdsl", features = ["emit"] }
# Test-only. The source-agnostic input layer drives the INTERACTIVE viewer test
# (`engine_interactive_viewer`): the window crate captures raw Win32 `(msg, wparam,
# lparam)` triples + raw-mouse deltas, and this crate's `translate_win32` /
# `translate_win32_raw_mouse` edge maps them into `RawInputEvent`s a `PhysicalInput`
# snapshot folds for WASD + mouse-look. DEV-only — the shipped backend never links it.
boyko-input = { path = "../boyko_input" }
