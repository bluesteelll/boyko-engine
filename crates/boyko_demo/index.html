<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>boyko_demo — boyko-engine ECS showcase</title>

    <!--
      Trunk builds the crate to wasm and injects the wasm-bindgen glue + a loader
      that calls the `#[wasm_bindgen(start)]` entry (`wasm_start` in main.rs).
      `data-bin` selects the `boyko_demo` binary target; `data-wasm-opt="z"`
      size-optimizes the wasm (it ships over the network). See Trunk.toml.
    -->
    <link data-trunk rel="rust" data-bin="boyko_demo" data-wasm-opt="z" />

    <style>
      /* Fill the viewport with a dark backdrop; the canvas covers it fully. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
      }

      /* The eframe canvas fills the window. eframe sizes the drawing buffer to
         the element's CSS box × devicePixelRatio each frame, so the 100%
         width/height here is the single source of truth for the size. */
      #boyko_demo_canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        outline: none;
      }

      /* Centered loading text shown until the wasm module boots and eframe
         paints over it. */
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #8a93a6;
        font: 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <!-- The id MUST match `CANVAS_ID` in src/main.rs. -->
    <canvas id="boyko_demo_canvas"></canvas>
    <p class="loading">loading boyko_demo…</p>
  </body>
</html>
