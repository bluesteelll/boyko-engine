[package]
name = "boyko-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "boyko_ui"
path = "src/lib.rs"

[dependencies]
boyko-ecs    = { path = "../boyko_ecs" }
boyko-macros = { path = "../boyko_macros" }
boyko-utils  = { path = "../boyko_utils" }
# P4: UI is a symmetric ACTION SOURCE (`ActionState::ui_press`) — `ui_dispatch`
# lowers an Interaction edge into an action. Acyclic: boyko-input does NOT depend
# on boyko-ui. The OS focus/cursor-inside flags on `PhysicalInput` are also read
# here for the blur/leave short-circuit (Decision 12).
boyko-input  = { path = "../boyko_input" }
# NOTE: boyko-threadpool is NOT a dependency in P1 — the apply pass is exclusive;
# the host already owns the pool to build the schedule.

[dev-dependencies]
# Integration tests build a hand-rolled Schedule (mirroring the demo's
# schedule-build + run pattern), which requires an Arc<ThreadPool>. macros is
# needed for #[derive(Component)] on test-local probe components.
boyko-threadpool = { path = "../boyko_threadpool" }
boyko-macros     = { path = "../boyko_macros" }
# P2 `ui!` macro compile-fail acceptance tests (snapshot-based).
trybuild         = "1"
