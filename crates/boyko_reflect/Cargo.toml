[package]
name = "boyko-reflect"
version = "0.1.0"
edition = "2024"
publish = false

# GATES G0 (docs/REFLECTION-PLAN-GATES.md): the EDITOR-ONLY reflection layer. This crate
# is depended on ONLY as `optional = true` behind a consumer feature named `reflect`
# (CORE D1/D2), so a ship build's resolved closure never contains it — a property gated
# by G1/G2/G3, never trusted to this comment. Directional rule (CORE F13):
# `boyko_serialize` and every shipping crate must never depend on this crate.
#
# NO `[features]` table, now or ever (GATES D4): the `#[cfg(feature = "reflect")]` in the
# derive's output is a CONSUMER-side construct, evaluated in the crate the derive expanded
# into. A self-hosted `reflect` feature here would test a configuration no consumer ever
# has — and four documents once specified a Miri row that could not run because they
# assumed one existed.
#
# CORE D18: depends on `boyko_ecs` and `std` only. No third-party crate, ever.
[dependencies]
boyko-ecs = { path = "../boyko_ecs" }

# D18 governs the SHIP-VISIBLE table above; dev-dependencies enter no consumer's
# resolved closure. `proptest` is the workspace's dev-only property-test instrument,
# mandated by CORE C1 gate 2 (full-range per-kind round-trips).
[dev-dependencies]
proptest.workspace = true
# CORE C6 gate 5: the `compile_fail` corpus that pins **the borrow checker's** refusal of
# a `NestedCursor` held across a `&mut` — the plan's *"the `'a` is the validity guarantee,
# compiler-enforced, not a documented contract"*. There is no other way to assert that a
# program does NOT compile, and C6's second RED (deleting the cursor's `'a` and `_pd`) is
# only observable through this harness.
#
# The workspace's established compile-fail instrument, declared exactly this way in five
# members already (`boyko_ecs`, `boyko_ui`, `boyko_log`, `aether_tests`,
# `boyko_rhi_vulkan`), each as a bare `"1"` rather than through `[workspace.dependencies]`
# — matched here rather than hoisted, because hoisting is a separate change and does not
# belong inside a rung. The `.stderr` bytes it pins are covered by the repository-wide
# compiler freeze in `tests/trybuild_corpus_compiler_witness.rs`.
trybuild = "1"

[lints]
workspace = true
