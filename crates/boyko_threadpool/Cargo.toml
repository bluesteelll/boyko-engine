[package]
name = "boyko-threadpool"
version = "0.1.0"
edition = "2024"
description = "Custom Chase-Lev work-stealing thread pool for boyko-engine Phase 9 scheduler"

[dependencies]
# The diagnostics substrate. This crate owns the ONE per-thread lane integer
# that the profiler and the logger both index by; the pool is the only code
# that knows which thread is which, so the pool is what writes it (D1). The
# edge is in-house and zero-dependency: `boyko_diag` has an empty
# `[dependencies]`, so `cargo tree -p boyko-diag -e normal,build` is one node
# and the pool's third-party graph is unchanged by this line.
boyko-diag = { path = "../boyko_diag" }
# The logging seam (rung L6). ONE call site: `abort_on_task_panic`, which is the pool's only
# diagnostic and is on the process-death path. The edge adds no third-party crate -- `boyko_log`
# depends on `boyko_diag` (empty `[dependencies]`) and `boyko_macros` -- and it cannot cycle:
# nothing in the logger names this crate, because the lane identity the logger indexes by is
# `boyko_diag`'s and is written HERE (D1).
boyko-log = { path = "../boyko_log" }
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"

[dev-dependencies]
criterion.workspace = true

# loom is pulled in ONLY under `--cfg loom` (Phase 9.1 D1/M3/M4). It is a
# normal (non-dev) dependency because the loom-shim lives in the library
# (`src/sync.rs`) and must resolve when the *lib* is built under `--cfg loom`,
# not only its tests. The `cfg(loom)` gate keeps it out of the normal build
# graph entirely: `cargo tree -p boyko-threadpool` without `--cfg loom` must
# not list it.
[target.'cfg(loom)'.dependencies]
loom.workspace = true

[features]
default = []
scheduler-trace = []

[lints]
workspace = true
