[package]
name = "boyko-log"
version = "0.1.0"
edition = "2024"
description = "In-house structured logging for boyko-engine: compile-time ceilings, one packed control byte per target, and no third-party facade"

# The diagnostics substrate, and the ONLY dependency this crate will ever have.
# It supplies the lane topology both diagnostics subsystems index by, the clock
# both stamp with, the loss vocabulary both count in, and the build-profile
# ceiling this crate re-exports as its own `GLOBAL_CEILING`. `boyko_diag` has an
# empty `[dependencies]`, so this edge adds no third-party crate to any graph
# that reaches the logger -- which is every crate in the engine.
#
# NO third-party logging facade. `log`/`tracing` are banned workspace-wide by a
# tidy check at L8b; this manifest is the first one that had the opportunity to
# add one and did not.
[dependencies]
boyko-diag = { path = "../boyko_diag" }

# The compile-fail gate for the code/class pairing (`tests/compile_fail_codes/`). `boyko_ecs`
# already carries this dependency for its own `compile_fail_*` suites; the pattern, the driver
# shape and the `TRYBUILD=overwrite` regeneration recipe are all theirs.
#
# A dev-dependency, so it reaches no shipping graph -- the same rule the `test-probe` feature below
# is written to, and the reason this crate can gate itself without widening what it links.
[dev-dependencies]
trybuild = "1"

[features]
default = []
# Rung L8a: the record-observation helpers in `src/probe.rs`, for crates whose `#[cfg(test)] mod`
# blocks need to assert that a site reported once and not once per frame. Emitting crates enable
# it in `[dev-dependencies]` ONLY, so it never reaches a shipping build. It is a feature rather
# than a `#[cfg(test)]` module because a downstream crate links this library compiled WITHOUT
# `cfg(test)` and cannot see one -- the wall rung L7b hit and answered with a private copy, which
# this replaces.
test-probe = []

[lints]
workspace = true
