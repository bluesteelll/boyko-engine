committed_paths_min = 2

# ⚠️ REV 12 -- THE RULE IS NOW INDEXED BY CAMERA PATH, because it was scalar while the census it
# consumes is per-path. Both documents nominate this string as the only live rule (see the note
# above), so a scalar rule and a min-over-paths aggregation two lines apart were two codeable texts
# at different arities: substitute paths A = (1.5e6 px, 2.4e6 tri) -> D = 1.60 and B = (2.0e6 px,
# 2.9e5 tri) -> D = 0.145, both clearing the 1024/1024 floors. A reader of the aggregation gets
# min = 0.145 -> UNDECIDED; an implementer of the scalar rule gets row A -> 1.60 >= 1.0 -> K1 dead.
# One census, opposite dispositions. The composition order is stated here rather than left to the
# reader: non-degeneracy is per path and EVERY path must clear it, then the MIN is taken over
# d_est. Non-degeneracy is not min'd -- a MIN over covered_pixels and a MIN over visible_tris taken
# separately would recombine into a d_est that belongs to no measured path at all.
# ⚠️ REV 14 MAKES THE RULE TOTAL. Rev 12 indexed it over P and left it with no value on |P| = 0 --
# the branch order sends an empty domain past a vacuously-false guard into a min over nothing. The
# undersized case is now the FIRST clause and it is an INSTRUMENT FAILURE, not a finding about
# content: the same disposition, and for the same reason, as a frame that fails non-degeneracy.
k1_decision_rule = "cheap_census_may_only_REFUTE, evaluated over the committed camera paths P of committed_paths_rule: |P| < committed_paths_min => NOT ADJUDICATED and R0d reds (an instrument failure, never UNDECIDED and never a favourable verdict; the min is not evaluated); degenerate(p) := covered_pixels(p) < min_covered_pixels OR visible_tris(p) < min_visible_tris; ANY p in P degenerate => UNDECIDED, escalate (and R0d reds, which takes precedence); else min over p in P of d_est(p) >= d_est_min => K1 dead; min over p in P of d_est(p) < d_est_min => UNDECIDED, escalate"

# FIRING K1 requires an upper-bound instrument, which is a separate conditional rung. Its threshold
# is pre-registered HERE, before that instrument exists, for the same reason everything else in this
# file is: so it cannot be chosen by whoever measures against it. Same value, because 1.0 IS the
# definition of the regime — but now applied to a statistic that can soundly sit below it.
#
# ⚠️ REV 38 SUBTRACTS the parenthetical "(the frustum+backface survivor counter)" that stood here.
# This paragraph is the one an implementer greps, and it named a candidate that the paragraph's OWN
# refutation five lines below rejects and that k1_fire_instrument_status calls UNSOLVED — the exact
# defect this file condemns at [k1]'s note on the deleted `rule` field ("a superseded field left in
# place with a comment saying so is still a field an implementer greps for and codes from"). The
# candidate now has a THIRD and engine-specific refutation, recorded in
# docs/VG-R11-UPPER-BOUND-INSTRUMENT.md: this engine performs NO backface culling in any scene pass
# (vb_raster_pipeline is built cull_mode: CullMode::None; the only two non-None sites in the tree are
# CullMode::Front in the CSM passes), so a BACKFACE conjunct in the numerator is UNSOUND here — back
# faces win vb_id texels and R0's own visible_tris contains them. Removing that conjunct collapses
# the candidate onto submitted/covered, refuted above. Seven candidate families are now adjudicated
# and all seven are dead; the sibling repair is in the plan's section 5.6.
# REV 6 -- K1 IS REFUTATION-ONLY AT R0, and this is a scope decision, not a deferral.
#
# Rev 5 named a "frustum+backface survivor counter in vb_raster.fs.hlsl" as the firing instrument.
# It is wrong twice, and the second reason is fatal to the idea rather than to the site:
#
#   (a) WRONG STAGE. A fragment shader runs for fragments that survived rasterisation and (with
#       early-Z) the depth test -- i.e. approximately the VISIBLE set, the very quantity vb_id
#       already caps. Frustum- and backface-culled triangles never reach it. And the plan's own
#       section 2 records that the per-primitive lane "is not independently reachable" without a
#       mesh shader, one draw per meshlet, or a software rasteriser.
#
#   (b) PROBABLY INERT ANYWAY. Apply section 5.4's own killing argument to the replacement:
#       survivors include every OCCLUDED in-frustum front-facing triangle, and depth complexity on
#       a multi-million-triangle corpus is exactly where the count lives. A 5M-triangle asset in
#       frame yields ~2.5M survivors against ~2.07M covered pixels at 1080p, so
#       survivors/covered < 1.0 cannot hold -- K1 could not fire whatever the visible triangle
#       size. That is `submitted/covered`'s self-satisfaction again with a 2-4x constant removed.
#
# So R0 does not fire K1. It can REFUTE it, cheaply and soundly, and that is R0's whole claim.
# Firing requires an upper bound on VISIBLE density that is shown to be NON-SATURATING -- a design
# problem, not a scheduling one. ⚠️ REV 27: Rev 26 substituted the tail of this sentence and left
# its governing "NOT to be" standing, producing "shown NOT to be NOT saturating" = SHOWN
# SATURATING -- a requirement that SELECTS FOR the defect: `visible_tri_per_covered_pixel`
