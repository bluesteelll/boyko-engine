measured_at = "full_detail_no_lod"

# ---------------------------------------------------------------------------------------------
# REV 8 -- THE DECIDABILITY APPARATUS WAS REMOVED FROM THIS FILE, AND THAT REMOVAL IS THE REVISION.
#
# Four tables stood here -- [decidability], [absolute_mode], [scope], [ordering] -- plus three
# [pre_registered] fields for R0e. Together they froze the ONE gate, the campaign's comparative
# performance claim, and its pre-registration ordering.
#
# They are gone because the gate they froze HAS NO LEFT-HAND SIDE. `our_floor` needs the ARMED
# PAIRED DELTA as its denominator, and R0's arm is not merely unstated: it is UNCONSTRUCTED. R0
# lands no meshlet, no cluster and no LOD, so there is nothing to contrast against and no measurand
# for the floor. Rev 7's adversarial review returned eight blocking P0s and five were downstream of
# that single over-reach -- pre-registering a comparative claim before the thing being claimed
# exists.
#
# A frozen value with no reader is WORSE than prose: it manufactures the appearance of
# pre-registration while binding nothing. Measured rather than argued -- tests/vg_symbol_reachability.rs
# found 32 unbound symbols across this file and the claim file, 20 of them in exactly these four
# tables. The sharpest specimen is `absolute_effective_floor_rule`, which Rev 7 added to embody its
# own slogan ("a fix that lands only in the frozen file has not landed") and which `absolute_gate_rule`
# never names, so the operative floor stayed the superseded one in BOTH documents.
#
# NOTHING IS LOST. The specification, the two denominators, the two-sided absolute gate form, the
# ABBA harness contract and the eight P0s that refuted the previous attempt all move to the plan's
# section 14, as requirements on whoever freezes them AT THE RUNG THAT LANDS AN ARM. They are
# cheaper and stronger there: the arm, the denominator and the floor are all defined at one rung.
#
# Do not restore these tables here. Re-authoring them at their own rung IS the plan.
# ---------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------
# [pre_registered] — a threshold that would otherwise be set by whoever measures against it.
#
# REV 5 created this table for two such thresholds. REV 8 keeps the one a surviving rung reads.
# The three R0e fields (r0e_ci_max_fraction, r0e_min_pairs, r0e_min_quads) left with the
# decidability apparatus above, and they earned a line of history on the way out: they were the
# clearest case for the removal. No R0e gate part ever read any of them, so the mutation the plan
# listed as DEMONSTRATED -- "halve the sample count -> the CI widens past the pre-registered bound
# -> red" -- still named a right-hand side that did not exist, inside the very table created to end
# that condition. Freezing a value is not the same act as reading one.
# ---------------------------------------------------------------------------------------------
[pre_registered]
# R0c gate (c): the census's covered-pixel total vs sv0_oracle::rasterize's covered_count on the
# procedural fixture at 512^2. Not zero: the oracle is a host mirror with its own sample-point rule,
# so exact agreement would be a coincidence, not a check.
r0c_oracle_coverage_tolerance = 0.02

# ---------------------------------------------------------------------------------------------
# [k2_probe] — REV 9. The legal values of the rig record's `reason` field, and which of them the
# machine re-derives.
#
# Rev 8 conditioned R0a's negative-branch re-derivation on `reason == "no_engine_registered"` and
# enumerated the legal values NOWHERE. That traded Rev 7's cannot-go-green for a cannot-go-red: an
# author writing any other string switched the only machine check off in the same act as recording
# the negative, while the surviving assertions (four non-PENDING fields, and a hash of a docs file)
# carry no information about UE5 at all. The rung's own stated purpose is "that a negative be the
# machine's, honestly bounded, rather than the author's".
#
# Section 6.2 fires K2 if ANY of three prerequisites fails, and exactly one of the three is
# machine-checkable from this box. So the values are enumerated, the checkable one is named, and
# the gate asserts the RIGHT thing per value instead of nothing.
# ---------------------------------------------------------------------------------------------
[k2_probe]
# The closed set. A `reason` outside it reds R0a — an unrecognised string is a typo or a new cause
# that has not been thought through, and both must stop the rung rather than disarm it.
reason_values = ["no_engine_registered", "insufficient_disk", "no_importable_project", "no_capture_protocol"]

# The one value whose truth the test can establish itself, by consulting the documented authorities
# (the launcher manifest and the registry hives that record launcher and source builds).
machine_rederived_reason = "no_engine_registered"

# What the gate asserts for the other three: the authorities DO report an engine. That is not a
# weaker check, it is the correct one -- those three causes presuppose an install, so a record
# claiming them while no engine is registered is self-contradictory and must red. Every value in
# the set is therefore checked against something, and no value switches the branch off.
non_rederived_reasons_require_engine_present = true

# REV 10 -- `reason` IS A SCALAR AND MORE THAN ONE VALUE CAN BE TRUE AT ONCE. Section 11 measures
# this box as BOTH "no installation present" AND "a UE5 install plus project plus DDC does not fit
# on D: today". Two values hold, the field takes one, and which one is written selects which
# assertion runs -- one green, three red. A gate whose verdict is chosen by the author's phrasing
# is the defect this table was added to remove, one level up.
#
# The precedence is therefore frozen, and it is ordered by what the machine can settle: the
# re-derivable cause outranks the others, because it is the only one an assertion can confirm
# against the documented authorities rather than take on trust.
#
# ⚠️ REV 12 WITHDRAWS "Ties below it are impossible -- the remaining three are distinguished by
# which prerequisite the operator could not supply." FALSE: a box with no importable project and no
# capture protocol holds both, and nothing distinguishes them. The list orders ALL FOUR, ties
# included, and that is its whole content.
reason_precedence = ["no_engine_registered", "insufficient_disk", "no_importable_project", "no_capture_protocol"]

# ⚠️ REV 12 -- WHAT READS THE LIST, stated because Rev 11 put it in a gate part where it could not
# fire, and this file's signature defect is a frozen value that binds nothing.
#
# Rev 11's R0a (a') required the recorded `reason` to be the first holding value this list names.
# Enumerate the gate's eight inputs (four legal `reason` values x authorities report engine
# present/absent): the verdict is identical to (b')'s on all eight, and permuting this list moves no
# row. The antecedent "where more than one holds" is not machine-establishable -- only
# no_engine_registered has an oracle, no_importable_project and no_capture_protocol have none, and
# the disk cause is retracted by name in the plan's R0a ("free disk is recorded as evidence and is
# deliberately NOT an assertion"). Asserting it would require minting a required_free_gb this
# campaign has retracted twice on the same evidence.
#
# So it is an AUTHORING convention and is deliberately not asserted -- the same disposition R0c(e)
# and free disk already carry. The substantive hazard it was frozen to close (the author selecting
# which assertion runs) is closed by (b'), which asserts something for EVERY legal value. The
# residual limit is enumerated in the plan's section 9.1, not claimed away here.
reason_precedence_status = "AUTHORING CONVENTION -- deliberately NOT gate-asserted; no machine oracle exists for three of the four reason_values, so no assertion over this list can fire"

# ⚠️ THE ONE INPUT THIS RULE CANNOT SERVE, recorded rather than discovered later. The plan's R0a
# already states that a hand-placed engine outside both documented authorities is invisible to
# them. Combine that with short disk: the honest `insufficient_disk` reds (the authorities report
# no engine, so the require-engine-present clause fails), and the only value that greens is
# `no_engine_registered`, which is FALSE of that box. The rung then forces a choice between a red
# gate and a false record.
#
# This is the intended cost of a bounded search rather than an unbounded volume walk -- Rev 4's
# "enumerate fixed volumes" was retracted for being untestable -- but it is a cannot-go-green on a
# real configuration and naming it is the whole discipline. The disposition is that R0a reds and
# the operator registers the engine with one of the authorities before re-running. A search that
# admits what it cannot see is stronger than one that claims to see everything; a search that also
# admits what it MISJUDGES is what this line adds.
hand_placed_engine_plus_short_disk_reds = true

# ---------------------------------------------------------------------------------------------
# [hash_assertion] — where this file's sha256 is actually checked.
#
# Rev 4 avoided Rev 2's "guaranteed to break" failure and created its mirror image: GUARANTEED NOT
# TO FIRE. Every rung that was supposed to re-assert the hash was a skipped or #[ignore]d GPU or
# corpus-dependent test, on a box whose CI never exercises the GPU path. A tripwire wired only into
# tests that do not run is not a tripwire.
#
# REV 6 added the flag below and gave it no rung and no file, so it described an intention nobody
# implements -- the same defect one level up. REV 8 names the deliverable and the rung that lands
# it, and the plan's section 8 R0a carries it as a gate part with its own red mutation.
# ---------------------------------------------------------------------------------------------
[hash_assertion]
# At least one assertion must live where `cargo test --workspace` executes it with no GPU, no dxc
# and no corpus. That test does nothing but re-hash this file against the value R0a recorded.
must_run_in_plain_workspace_test = true

# The deliverable, landed by R0a. `boyko_render` is in the workspace's `default-members`, so the
# bare command form reaches it, and `crates/boyko_render/src/smaa_luts.rs` already carries an
# in-house `sha256_hex` -- no new dependency, no GPU, no dxc, no corpus.
#
# The GPU rungs may re-assert the hash opportunistically; none of them IS the mechanism. Stating
