# VG campaign thresholds — AUTHOR-FROZEN. This file never changes.
#
# WHY THIS FILE IS SEPARATE FROM docs/VG-CAMPAIGN-CLAIM.toml.
#
# Rev 2 put both halves in one hashed unit and the freeze died on contact with its own schedule.
# The claim file contains owner VALUES calls that the ladder REQUIRES to be filled — R0b cannot
# author CORPUS.toml until `corpus.arrangement` is answered. Filling it changes the file's sha256,
# so the hash recorded at R0a is guaranteed to break before the first rung that asserts it. Once
# "the hash moved again, re-record it" is a routine event, the tripwire has no signal left: any
# re-record can carry a simultaneous edit to a K1 threshold and every rung stays green.
#
# So the two halves are split by their update discipline, not by their subject:
#
#   * THIS file  — author-set, decision-bearing, frozen at authoring time, **never edited**. Its
#                  sha256 is recorded once by R0a and re-asserted by R0c/R0d/R0e/R0f. A change here
#                  is a new plan revision with a dated amendment in the plan's §11, and it reds
#                  four rungs until the recorded hash is deliberately updated in the same act.
#   * CLAIM file — owner VALUES calls, PENDING until answered, filled exactly once. Not hashed;
#                  gated instead by a sentinel rule (a rung that needs a field asserts it is not
#                  PENDING), which is the discipline goldens/PINS.toml already uses.
#
# Nothing in this file was tuned against a measurement: it is authored before the ingest path, the
# census instrument, the census run, the harness and the reference capture exist.

schema_version = 3
frozen_at_revision = "docs/MESHLET-VIRTUAL-GEOMETRY-PLAN.md Rev 6"
frozen_date = "2026-07-27"

# THE EDIT DISCIPLINE, stated because Rev 4 and Rev 5 both edited this file in place while its
# header said "never edited" and the plan's amendment table read "No amendment yet."
#
# The freeze BEGINS when R0a records this file's sha256. R0a has not run and no code exists, so
# every edit so far is AUTHORING, not amendment -- legitimate, but it must be visible, which is
# what schema_version and frozen_at_revision are for. Both were stale through Rev 4 and Rev 5.
#
# After R0a records the hash: no in-place edits. A change is a new plan revision plus a dated entry
# in the plan's section 11.1, and the recorded hash is updated in the same commit, deliberately.
freeze_begins_at = "R0a records the sha256"
pre_r0a_edits_are_authoring_not_amendment = true

# ---------------------------------------------------------------------------------------------
# [census] — the resolution ladder. Frozen because density scales as 1/resolution^2, which makes
# resolution the parameter most able to decide K1 silently.
# ---------------------------------------------------------------------------------------------
[census]
# The census runs the whole ladder and reports a CURVE. 512x512 is not a free choice — it is the
# existing DUMP_EXTENT (crates/boyko_app/tests/sv0_scene/mod.rs:162), the extent every VB fixture
# and golden pin already uses.
resolution_ladder = [[512, 512], [1920, 1080], [2560, 1440], [3840, 2160]]

# The resolution at which K1 is adjudicated. 1920x1080: the modal PC gaming resolution, and the
# one at which a performance claim would be made. Choosing 2160p here would flatter the campaign
# (denser pixels reach micro-polygon sooner); choosing 512x512 would refute it unfairly.
decision_resolution = [1920, 1080]

# The census must ASSERT the achieved extent equals the requested rung, per rung. This is not
# paranoia: the sibling harness already carries the same check at 512x512
# (sv0_deferred_term_bench.rs:297-299, "an OS-clamped window would silently measure a different
# per-pixel workload"), and this engine's extent is a real OS window client area
# (crates/boyko_rhi_vulkan/src/window.rs:252, AdjustWindowRectEx at :310). A display that clamps
# 1440p and 2160p produces three plausible rows and a fabricated curve.
assert_achieved_extent = true

# The readback is streamed and hashed, never retained. At 3840x2160 x 8 B = 66.4 MB per censused
# frame, and the plan's SS11 records this volume at 16 GB free with target/ at 58 GB, retention
# would reproduce this project's standing hazard of disk exhaustion surfacing as mingw linker
# errors.
readback_retention = "stream_and_hash"

# Cross-run gate. See [k1_instrument].ladder_convergence_margin for the other self-check.
# NOTE: "byte_identical" is a HYPOTHESIS to be tested by R0c, not an assumption. Rev 2 justified it
# by the 24 golden pins, which is invalid: the pins hash an 8-bit shaded BMP and this project has
# MEASURED them blind below ~2^-16 relative. Two adjacent triangles of a smooth mesh can shade
# identically to 8 bits and carry different vb_id. R0c must MEASURE cross-process vb_id identity
# before R0d relies on it; if it does not hold, the fallback below applies and the non-determinism
# is itself a finding about the raster path.
cross_run_gate = "byte_identical"
cross_run_spread_fallback = 0.05

# ---------------------------------------------------------------------------------------------
# [k1_instrument] — how screen-space triangle density is estimated. THIS IS THE PART REV 2 GOT
# WRONG, and the reasoning is recorded because the error is instructive.
#
# Rev 2's decisive statistic was `submitted_per_covered_pixel` = all submitted triangles / covered
# pixels, adopted as the "generous end of a bracket" so that a mis-set threshold would err toward
# keeping the campaign alive.
#
# It IS a valid upper bound (submitted triangles are a superset of visible ones). It is also so
# loose as to be useless: it counts back-face-culled and off-screen geometry, so it conflates "the
# triangles are small" with "the level contains a lot of geometry". Firing K1 requires
# submitted/covered < 1.0 — i.e. the whole frame submits fewer triangles than the screen has
# covered pixels — while R0b's own gate requires the corpus to carry published high-poly counts.
# A corpus that satisfies R0b can never satisfy K1's decisive conjunct. The kill was self-satisfied
# out of existence.
#
# THE REPLACEMENT USES THE LADDER, WHICH COSTS NOTHING NEW.
#
# For a fixed camera and fixed geometry, a triangle's screen-space area scales exactly with pixel
# count. A triangle covering 4 px at 2160p covers 1 px at 1080p. So:
#
#   * visible_tris(R) — the count of distinct (instance_id, local_tri) in the readback at
#     resolution R — is monotonically increasing in R, because raising resolution lets smaller
#     triangles win coverage races that they lost before;
#   * it converges, as R grows, to the true count of front-facing, unoccluded triangles in view;
#   * measuring at the TOP rung therefore reveals exactly the sub-pixel population that the
#     decision resolution hides, which is the population this campaign is about.
#
# The uncapped density estimate at the decision resolution is then
#
#     D_est = visible_tris(top rung) / covered_pixels(decision_resolution)
#
# — unbounded above, unlike the saturating per-resolution ratio, and TIGHT, unlike submitted/covered.
#
# AND IT VALIDATES ITSELF. The ladder gives four points on a convergence curve. If the top two
# rungs still differ by more than the margin below, visible_tris has NOT converged, D_est is an
# underestimate of unknown size, and the census reports "density not resolved" — K1 is NOT
# adjudicated. That is the plan's own SS9 clause 4 discipline (the instrument is blind, not the
# effect absent) applied before the fact instead of after it.
# ---------------------------------------------------------------------------------------------
#
# REV 4 CORRECTION — the Rev 3 text above calls D_est uncapped and treats it as fit to FIRE K1.
# Both are false, one line of arithmetic each:
#
#   CEILING. visible_tris(R) counts distinct pairs in a readback holding ONE pair per texel, so
#   visible_tris(2160p) <= 3840*2160. At a common covered fraction,
#   D_est <= (3840*2160)/(1920*1080) = 4.0 EXACTLY. That is Rev 1's construction defect with the
#   ceiling raised from 1 to 4 by this ladder's own area ratio. d_est_min = 1.0 therefore sits at a
#   quarter of the instrument's ceiling — a fine place for a threshold, reached by accident.
#
#   DIRECTION. Sub-pixel triangles that win no sample are absent from visible_tris, so
#   D_est <= true density: a LOWER bound. Rev 3 fired a campaign-refuting kill on it. A lower bound
#   cannot refute. It can only CONFIRM.
#
# The asymmetry that follows is good news, not a dead end:
#   D_est >= 1.0  PROVES density >= 1 tri/pixel  =>  K1 DEAD, and the cheap census (usage bit +
#                 Option-threaded copy, zero new .spv, zero re-bless) closed the question.
#   D_est <  1.0  is indistinguishable from "the instrument hit its ceiling" seen from below.
#                 Refuting the premise needs an UPPER bound; every vb_id statistic is capped by
#                 one-winner-per-texel, so it must come from OUTSIDE vb_id — a counter of triangles
#                 surviving frustum+backface in the raster path. That edits vb_raster.fs.hlsl and
#                 moves the blast radius the census was designed to avoid, so it is a SEPARATE and
#                 CONDITIONAL rung with its own re-bless budget.
#
[k1_instrument]
# Bound direction and ceiling as DATA, so no later rung re-derives them from prose.
# ceiling = (top ladder rung pixels) / (decision resolution pixels).
d_est_bound_direction = "lower"
d_est_ceiling = 4.0
d_est_may_fire_k1 = false
d_est_may_refute_k1 = true

# Non-degeneracy precondition — ABSENT in Rev 3 and required. On a sentinel-only readback
# visible_tris = 0 at both top rungs: the convergence check reads 0 <= 0 (CONVERGED) and
# D_est = 0 < 1.0, so K1 fires on an empty frame. covered_pixels == 0 is an explicit failure,
# never a division.
min_covered_pixels = 1024
min_visible_tris = 1024

# The histogram scaling law. Rev 3 froze "exactly two buckets between adjacent rungs" and that gate
# was RED BY CONSTRUCTION — two buckets is 4x area (2x linear) and this ladder has no such step:
# 512^2->1080p = 7.910x (2.98 buckets), 1080p->1440p = 1.778x (0.83), 1440p->2160p = 2.250x (1.17).
# Modal-bucket indices are integers over powers of two, so 0.83 is not even expressible as a shift.
# The check is now the per-pair log2 of the ACTUAL area ratio, within a tolerance, with the residual
# reported rather than an integer asserted.
histogram_shift_rule = "per_pair_log2_area_ratio"
histogram_shift_tolerance_buckets = 0.35

# Rung 1 is EXCLUDED from the scaling check: 512^2 is 1:1 while the other three are 16:9, so the
# projection is a DIFFERENT FRUSTUM, not a rescaling — the visible triangle set differs and the
# "area scales with pixel count" premise does not hold across 512^2 -> 1080p at all. Rung 1 keeps
# its one job: the CPU-oracle cross-check.
histogram_shift_excludes_rungs = [0]

# The relative gap between the top two ladder rungs' visible_tris below which the count is
# treated as converged. 0.05: a 5% residual on a curve that is flattening, chosen for the same
# reason the sibling harness's spread gate is 0.10 — tight enough to mean something, loose enough
# not to red on ordinary variation.
ladder_convergence_margin = 0.05

# If the ladder has not converged, K1 is not adjudicated and the campaign is neither refuted nor
# confirmed by density. The disposition is to extend the ladder upward (a new plan revision), NOT
# to adjudicate on an underestimate.
# REV 6 CORRECTION -- Rev 5 made this unconditional and it contradicted the plan's own section 5.6.
# Non-convergence means visible_tris is still RISING, i.e. D_est UNDERSTATES. An understatement
# already at or above 1.0 still proves density >= 1. Convergence is a precondition for FIRING,
# never for REFUTING -- and since Rev 6 makes K1 refutation-only at R0 (see [k1]), the unconditional
# form would have blocked the ONLY outcome R0 can produce. That is a frozen file vetoing its own
# plan's decisive case, which is the doc-rot class this campaign spent a session repairing.
on_not_converged_refute_direction = "still_valid"   # D_est >= 1.0 refutes K1 regardless
on_not_converged_fire_direction = "k1_not_adjudicated"

# ---------------------------------------------------------------------------------------------
# [k1] — the "no content, no mechanism" kill. Two conjuncts, BOTH pointing the same way.
#
# Rev 2 had three, and its `rule = "all_three_below"` inverted the third: `modal_bucket_max_pixels`
# is a MAX while the other two are MINs, so on the canonical no-mechanism scene (a few giant flat
# quads) the first two conjuncts held and the third did not, and K1 did not fire on the exact
# scene it was written to catch. An implementer coding from the frozen TOML would have written
# `modal < 16` and produced a kill that fires when triangles are SMALL — i.e. when the campaign's
# premise is confirmed.
# ---------------------------------------------------------------------------------------------
[k1]
# Conjunct 1. D_est (see [k1_instrument]) below 1.0 at the decision resolution. Not a tuned value:
# 1.0 IS the definition of the regime cluster LOD exists to serve.
d_est_min = 1.0

# Conjunct 2. The screen-space triangle-size histogram's modal bucket at the decision resolution,
# in pixels, powers of two. 16 = a 4x4 footprint; above that, triangles are large and cluster LOD
# is not the lever. Derived from the top rung's histogram by the exact power-of-two shift the
# scaling law gives (2 buckets per 2x resolution step), which the ladder's own four points check.
modal_bucket_pixels_above_which_k1_holds = 16

# K1 fires iff BOTH conjuncts hold: D_est < d_est_min AND modal bucket >
# modal_bucket_pixels_above_which_k1_holds. Spelled out as a sentence because Rev 2's terse rule
# string is what inverted it.
#
# REV 5 CORRECTION — the two-conjunct rule below is REDUNDANT, and the redundancy hid that the
# cheap census cannot fire K1 at all.
#
#   modal_bucket_px > 16 at 1080p  =>  the typical visible triangle covers >= 16 px
#                                  =>  visible_tris <~ covered_px / 16
#                                  =>  D_est <~ 0.06, far below d_est_min = 1.0.
#
# So conjunct 1 holds AUTOMATICALLY whenever conjunct 2 does. Rev 4 sold this as "two conjuncts,
# both pointing the same way"; it is one conjunct plus a strictly weaker consequence of it. The
# decisive statistic was always the modal bucket — which is the statistic whose cross-rung
# derivation the frozen ladder cannot support (see histogram_shift_rule above).
#
# And per [k1_instrument], D_est is a LOWER bound: it cannot refute the premise at all. Neither
# conjunct can soundly fire this kill. The honest rule is therefore split by DIRECTION:
#
rule = "SUPERSEDED_BY_k1_decision_rule_below"

# What the CHEAP census (usage bit + Option-threaded copy, zero new .spv) can decide, soundly:
#   D_est >= d_est_min  =>  K1 REFUTED. Density is genuinely >= 1 tri/pixel; the mechanism exists.
# It can decide nothing else. Everything below d_est_min is indistinguishable from the instrument's
# own ceiling seen from underneath.
k1_decision_rule = "cheap_census_may_only_REFUTE: d_est >= d_est_min => K1 dead; d_est < d_est_min => UNDECIDED, escalate"

# FIRING K1 requires the upper-bound instrument (the frustum+backface survivor counter), which is a
# separate conditional rung. Its threshold is pre-registered HERE, before that instrument exists,
# for the same reason everything else in this file is: so it cannot be chosen by whoever measures
# against it. Same value, because 1.0 IS the definition of the regime — but now applied to a
# statistic that can soundly sit below it.
# REV 6 -- K1 IS REFUTATION-ONLY AT R0, and this is a scope decision, not a deferral.
#
# Rev 5 named a "frustum+backface survivor counter in vb_raster.fs.hlsl" as the firing instrument.
# It is wrong twice, and the second reason is fatal to the idea rather than to the site:
#
#   (a) WRONG STAGE. A fragment shader runs for fragments that survived rasterisation and (with
#       early-Z) the depth test -- i.e. approximately the VISIBLE set, the very quantity vb_id
#       already caps. Frustum- and backface-culled triangles never reach it. And the plan's own
#       section 2 records that the per-primitive lane "is not independently reachable" without a
#       mesh shader, one draw per meshlet, or a software rasteriser.
#
#   (b) PROBABLY INERT ANYWAY. Apply section 5.4's own killing argument to the replacement:
#       survivors include every OCCLUDED in-frustum front-facing triangle, and depth complexity on
#       a multi-million-triangle corpus is exactly where the count lives. A 5M-triangle asset in
#       frame yields ~2.5M survivors against ~2.07M covered pixels at 1080p, so
#       survivors/covered < 1.0 cannot hold -- K1 could not fire whatever the visible triangle
#       size. That is `submitted/covered`'s self-satisfaction again with a 2-4x constant removed.
#
# So R0 does not fire K1. It can REFUTE it, cheaply and soundly, and that is R0's whole claim.
# Firing requires an upper bound on VISIBLE density whose firing condition is shown NOT to be
# precluded by R0b's own high-poly corpus gate -- a design problem, not a scheduling one, and out
# of R0's scope until someone solves it.
k1_fire_at_r0 = false
k1_fire_instrument_status = "UNSOLVED -- needs an upper bound not precluded by R0b's corpus gate"

# The modal-bucket conjunct is RETIRED from the decision. It is redundant against D_est, its
# cross-rung derivation is unsupported by this ladder, and its direction was inverted in Rev 3.
# It stays as a reported statistic.
modal_bucket_role = "report_only"

# Reported alongside, and deliberately NOT part of the rule: the saturating per-resolution ratio
# (distinct visible triangles / covered pixels, capped at 1 by construction because vb_id is one
# R32G32_UINT texel per pixel) and submitted_per_covered_pixel. The first is the raw reading, the
# second is a cull-efficiency reading. Neither adjudicates K1; both are on the page so the
# instrument's own behaviour is visible.
report_only = ["visible_tri_per_covered_pixel", "submitted_per_covered_pixel"]

# The census renders at FULL detail — this engine has no LOD, so there is no error target to hold.
# That makes the censused density the CEILING of the mechanism available to any LOD scheme: a
# cluster hierarchy can only reduce triangles below it. If the ceiling does not reach the regime,
# no LOD scheme reaches it either. K1 is decidable without an error target, and this is why.
measured_at = "full_detail_no_lod"

# ---------------------------------------------------------------------------------------------
# [decidability] — the harness contract. Plan SS7 and SS8 R0e.
#
# The three session constants are the literals crates/boyko_app/tests/sv0_deferred_term_bench.rs
# already carries at :350, :366 and :378, measured on this exact box. But Rev 2 transferred the
# literals while silently changing their DENOMINATORS, which weakened the null control by roughly
# 20x: the sibling gates |null median delta| against the ARMED DELTA (it fired at 33% — -2048 ns
# against a 6144 ns signal — and that failure is what produced the ABBA redesign), whereas Rev 2
# gated it against "the smallest per-pass median", an absolute pass cost. A pass costing 100 us
# would have had a 10 us null budget where the sibling's was 614 ns, and the precedent's own red
# event would have passed. The denominators are therefore stated explicitly below, not implied.
# ---------------------------------------------------------------------------------------------
[decidability]
sessions = 3

# Denominator: the ARMED PAIRED DELTA, as in the sibling. Not a pass median.
null_control_max_fraction = 0.10
null_control_denominator = "armed_paired_delta"

# Denominator: the PAIRED DELTA across sessions, as in the sibling. Not an absolute pass median.
#
# This distinction is load-bearing and measured: this project has recorded ~21% run-to-run spread
# on ABSOLUTE GPU pass costs at high N (the VB-P1d bench), so a 0.10 gate applied to absolute
# medians would red for a known instrument property rather than a finding. See
# [absolute_mode] for the branch that has no choice but to measure absolutes.
session_spread_max = 0.10
session_spread_denominator = "paired_delta"

# How the two instruments' floors combine into the joint floor of the ONE gate. "sum", and the
# reason is stated rather than conventional: quadrature assumes two independent draws from one
# noise process, and a systematic capture bias between two different engines (different clock
# discipline, different pass boundaries, a driver-side difference) is not an independent random
# error. Summing is conservative in the direction that makes our own claim harder to close.
joint_floor_rule = "sum"

# The reference side is an instrument too. A claim smaller than the REFERENCE's own reproducibility
# is unfalsifiable no matter how good our side is — a term Rev 1 never had at all.
reference_floor_source = "cross_session_spread_of_reference_capture"

# ---------------------------------------------------------------------------------------------
# [absolute_mode] — the K2 branch, which needs a DIFFERENT instrument and does not get to pretend
# otherwise.
#
# Rev 2's R0f' claimed "nothing new to measure — the left-hand side is already ours". That is
# false, and it is the sharpest thing the Rev 2 critique found. The harness SS7 mandates measures
# PAIRED DIFFERENCES; its entire algebra exists to CANCEL the absolute terms
# (sv0_deferred_term_bench.rs:34, :58-62 — the per-frame baseline mu, the frame-in-flight-slot
# offset gamma, and the position drift beta all cancel in (d1+d2)/2). Those are exactly the terms
# an absolute millisecond target must retain, and this repo has MEASURED them to be large.
#
# So absolute mode carries its own floor, measured its own way, and it is expected to be WORSE.
# Stating that plainly is the point: a weaker instrument honestly reported beats a strong-looking
# number the harness cannot support.
# ---------------------------------------------------------------------------------------------
[absolute_mode]
# R0f' MUST derive this by measurement, not adopt it. The value below is the pre-registered
# CEILING the measurement must come in under for absolute mode to be decidable at all; it is set
# from this project's recorded ~21% absolute-cost spread with margin, and R0f' reds if the measured
# absolute spread exceeds it.
absolute_session_spread_ceiling = 0.25
# REV 7 CORRECTION -- this field said PER-PASS while absolute_floor_ms_rule scales the CHAIN
# median by it, and [scope].chain_floor_rule forbids exactly that composition ("the passes share
# occupancy, caches and the same queue"). Two implementers coding from this file built different
# floors, and the floor is the left-hand side of the ONE gate on the expected branch. One
# construction, named once, consistent with [scope]:
absolute_floor_source = "cross_session_spread_of_the_CHAIN_TOTAL_absolute_medians"

# REV 7 -- the lattice floor [decidability] has and this branch did not. Section 7 clause 3 is
# labelled non-negotiable and the sibling MEASURED the failure it guards: a "spread" that is one
# counter step carries no information. Without it absolute_gate_rule collapses at s -> 0 to
# `c < m` -- any improvement however small is "decidable" -- and the error runs in the direction
# that makes the ONE gate EASIER to close on the branch section 11 calls expected. That is R16
# again (a gate transferred without its precondition), one branch over.
absolute_effective_floor_rule = "max(measured_absolute_spread, measured_lattice_ns / |chain_median_ns|) * measured_chain_median_ms"
absolute_lattice_evidence_required = true   # same SV0_LATTICE_MIN_DISTINCT_TICKS = 7 evidence floor

#
# REV 5 CORRECTION — the two fields above are a RELATIVE fraction, and Rev 3/Rev 4's R0f' gate (b)
# compared the same named source against a MILLISECOND target. One source cannot be both. Under
# either reading the gate failed:
#
#   read as relative  =>  gate (b) compares a fraction to milliseconds — the exact dimension error
#                         R0f' was written to fix, one file over;
#   read as absolute  =>  gate (b) reads "0.28 ms < 5 ms", TRUE for any non-degenerate target. A
#                         RESOLUTION being smaller than a LEVEL says nothing about whether the
#                         instrument can tell the target apart from where we stand.
#
# That mattered because R0f' closes the ONE gate on the branch section 11 measures as the EXPECTED
# one. A non-discriminating gate there leaves the likely path with no falsifiability condition —
# which is the whole defect D3 was raised against, surviving three revisions.
#
# The fix is to name the quantity ONCE and make the inequality about a DISTANCE, not a level.
#
# The floor in milliseconds: the relative spread applied to the measured chain median.
absolute_floor_ms_rule = "absolute_session_spread * measured_chain_median_ms"

# The distance the campaign must resolve, in milliseconds: how far the current chain is from the
# absolute target. A target we are already past, or one sitting inside our own resolution, is not
# a target.
absolute_distance_ms_rule = "abs(measured_chain_median_ms - claim.absolute_chain_ms)"

# REV 6 CORRECTION -- Rev 5's gate `absolute_floor_ms < absolute_distance_ms` was SYMMETRIC, and
# its own named red mutation PASSED. With m = measured chain median, c = claim, s = spread:
#
#   c > m (target ALREADY BEATEN)      => distance = c-m, gate passes whenever c > m(1+s).
#                                         Rev 5's prose asserted "a target already passed now reds".
#                                         False outside a +/- s*m band.
#   c < s*m (Rev 5's OWN red mutation) => distance = m-c > m(1-s), floor = s*m, so the gate is
#                                         s*m < m(1-s)  <=>  s < 0.5, TRUE for every s <= 0.25 the
#                                         ceiling permits. THE MUTATION PASSES.
#
# A gate that cannot go red for its own named mutation is this campaign's #1 defect family,
# committed in the clause rewritten to eliminate it, on the branch section 11 calls expected.
#
# The fix is that the gate is TWO-SIDED, because the claim must be both an IMPROVEMENT and a
# RESOLVABLE one. Rev 5 encoded only the second half and then described the first in prose.
absolute_gate_rule = "claim.absolute_chain_ms < measured_chain_median_ms  AND  absolute_floor_ms < absolute_distance_ms"

# Red mutations that ACTUALLY fire, re-derived rather than re-worded:
#   set c > m                       -> the first conjunct reds (nothing to close; the campaign's
#                                      premise on this branch is already satisfied)
#   set c inside (m - s*m, m)       -> the second reds (the gap is inside our own resolution)
# Note what is deliberately NOT red: an absurdly AMBITIOUS target (c -> 0) passes, and that is
# correct. This gate adjudicates DECIDABILITY, not achievability -- a 1000x claim is trivially
# resolvable, and whether it is sane is section 13 Q1's business, not the instrument's.
absolute_gate_red_mutations = ["c_greater_than_m", "c_within_floor_of_m"]

# ---------------------------------------------------------------------------------------------
# [scope] — what the claim is ABOUT. Rev 2 compared a per-pass floor to a frame-total claim with
# no composition rule stated anywhere, which made the ONE gate not evaluable.
# ---------------------------------------------------------------------------------------------
[scope]
# The claim is about the BRACKETED PASS CHAIN, not a frame. R0e brackets the VB raster, vb_geo,
# the classify chain, and the three passes VbTimedPass already covers. A frame also contains CSM,
# SDF, DDGI, post/AA, present and all CPU time, none of which this campaign touches and none of
# which the harness measures.
claim_scope = "bracketed_vb_pass_chain"

# How N per-pass floors compose into the chain floor: the chain total's floor is measured directly
# on the chain total (one bracket spanning the chain), NOT composed arithmetically from the
# per-pass floors. Composing them would require an independence assumption the passes do not
# satisfy — they share occupancy, caches and the same queue.
chain_floor_rule = "measured_directly_on_chain_total"

# The per-pass regression rule needs a correspondence between our pass names and the reference's.
# It cannot be evaluated without one, and whoever writes it after both tables exist writes it with
# the answer in hand. R0a therefore records the reference's pass names for its stock scene BEFORE
# any corpus capture, and R0f asserts the map is total over our bracketed set.
require_pass_correspondence_map_at = "R0a"

# ---------------------------------------------------------------------------------------------
# [ordering] — REV 5. The P0's mechanism now lives on the HASHED side.
#
# Rev 3/Rev 4 put the ordering rule (`r0e_blocked_by`) only in VG-CAMPAIGN-CLAIM.toml, which is
# "deliberately not hashed". So the single most decision-bearing rule in the campaign sat on the
# mutable side, disarmable by deleting one line, while [k1], [scope] and [decidability] were frozen.
# Answering the question honestly: no, Rev 4 did NOT have every decision-bearing value on the
# correct side. This is the correction.
# ---------------------------------------------------------------------------------------------
[ordering]
# The claim must be answered before the rung that MEASURES the floor, not before the rung that
# compares. Duplicated here from the claim file's [gating] so that deleting it there reds the hash.
# REV 6 CORRECTION -- Rev 5 named ONE rung for TWO instruments, which left the P0 vacuous on the
# branch section 11 measures as expected. In nanite_relative mode R0e measures the floor, so
# blocking R0e is the mechanism. In ABSOLUTE mode the plan states plainly that R0e's paired-delta
# floor is unusable and R0f' "needs its own instrument" -- so the floor the claim is compared
# against is measured TWO RUNGS LATER, with the claim already filled and visible in the tree.
# Blocking R0e constrains nothing about the number R0f' will produce.
#
# The rule attaches to THE RUNG THAT MEASURES THE FLOOR FOR THAT MODE.
claim_blocks_rung_nanite_relative = "R0e"
claim_blocks_rung_absolute = "R0f_prime"

# The stronger half, adopted from sv0_deferred_term_bench.rs's NAN-as-UNMEASURED sentinel ("so a
# forgotten transcription cannot produce a passing gate"): the harness refuses to EMIT the floor
# while the claim is PENDING. Ordering constrains commits; this constrains knowledge, which is what
# the P0 actually needs. Rev 3's claim that ordering alone "does not depend on anyone noticing an
# edit" is retracted in the plan's section 0.1.
harness_withholds_floor_while_claim_pending = true

# After the fill, the claim must not move. R0e asserts only `!= PENDING`, and R0f re-reads the file
# at R0f time, so Rev 4 left a window: fill 0.05 -> R0e green -> floor measures 0.12 -> edit to 0.30
# -> R0e STILL green -> R0f closes. The claim value is therefore pinned INTO R0e's own
# MEASURED-literal commit, so R0f compares against something frozen in the same act as the floor.
claim_pinned_into_r0e_literals = true

# ---------------------------------------------------------------------------------------------
# [pre_registered] — REV 5. Two thresholds the plan called "pre-registered" while providing no file
# to register them in. Both were decision-bearing, both would have been set by whoever measured
# against them, and both landed on NEITHER side of the two-file split — the Rev 1 P0 shape, twice.
# R0e's named mutation ("halve the sample count -> the CI widens past the pre-registered bound")
# could not fire against anything at all.
# ---------------------------------------------------------------------------------------------
[pre_registered]
# R0c gate (c): the census's covered-pixel total vs sv0_oracle::rasterize's covered_count on the
# procedural fixture at 512^2. Not zero: the oracle is a host mirror with its own sample-point rule,
# so exact agreement would be a coincidence, not a check.
r0c_oracle_coverage_tolerance = 0.02

# R0e: the confidence interval the resolvable delta must come in under, and the sample-count floors
# beneath which the interval is not reportable at all. The two floors are the sibling's own
# (SV0_BENCH_MIN_PAIRS / SV0_BENCH_MIN_QUADS) — reused rather than minted, same as [decidability].
r0e_ci_max_fraction = 0.10
r0e_min_pairs = 30
# REV 6 CORRECTION. Rev 5 froze this as 200 and attributed it to the sibling's SV0_BENCH_MIN_QUADS.
# That constant is `SV0_BENCH_MIN_QUADS: usize = SV0_BENCH_MIN_PAIRS` = **30**. 200 is
# SV0_S1_5_SESSION_QUADS -- the transcribed OBSERVED quad count, under the sibling's "MEASURED
# values -- do not edit these literals" banner. So Rev 5 took a measurement, called it a
# pre-registered protocol floor, attributed it to a constant carrying a different value, and froze
# it -- inside the very section added to fix "three authored constants called measured", with the
# error running the other way. Corrected to the sibling's actual floor.
r0e_min_quads = 30

# ---------------------------------------------------------------------------------------------
# [hash_assertion] — REV 5. Where this file's sha256 is actually checked.
#
# Rev 4 avoided Rev 2's "guaranteed to break" failure and created its mirror image: GUARANTEED NOT
# TO FIRE. Every rung that was supposed to re-assert the hash (R0b-R0f) is a skipped, #[ignore]d
# GPU or corpus-dependent test, on a box whose CI never exercises the GPU path. A tripwire wired
# only into tests that do not run is not a tripwire.
# ---------------------------------------------------------------------------------------------
[hash_assertion]
# At least one assertion must live where `cargo test --workspace` executes it with no GPU, no dxc
# and no corpus. That test does nothing but re-hash this file against the value R0a recorded.
must_run_in_plain_workspace_test = true
