k1_fire_at_r0 = false
# REV 25 -- this value stated its requirement in terms of the preclusion withdrawn above.
k1_fire_instrument_status = "UNSOLVED -- needs a non-saturating upper bound on VISIBLE density; R0b floors no triangle count, so the corpus constrains it neither way"

# REV 38 -- THE FIRING AGGREGATION, absent until now, and its absence was a live hole rather than a
# tidiness one. k1_path_aggregation above is justified EXPLICITLY AND ONLY for refutation, and
