# VG campaign claim — the RIGHT-HAND SIDE of the ONE gate. Owner VALUES calls only.
#
# WHY THIS FILE EXISTS.
# The virtual-geometry campaign's ONE gate is an inequality:
#
#     joint decidability floor  <  the delta we intend to claim
#
# Rev 1 of docs/MESHLET-VIRTUAL-GEOMETRY-PLAN.md defined only the LEFT side. The right side was
# never written down and would have been set by the same author who measures the left. Its named
# red mutation could only fire by moving the floor UP; raising the intended delta after seeing the
# floor fired nothing.
#
# Rev 2 created this file and thought that closed it. It did not, and the reason is worth keeping:
# **every field on the right-hand side was the string PENDING, and Rev 2's own [gating] table
# scheduled it to be filled AFTER R0e measured the floor.** A sha256 was wrapped around a
# placeholder. The defect was identical to Rev 1's, one level of indirection down.
#
# REV 3'S FIX IS ORDERING, NOT HASHING.
#
#   The claim must be answered BEFORE the floor is measured. So the fields below block **R0e** —
#   the rung that measures the floor — not R0f, the rung that compares them. R0e's test refuses to
#   run while the field it will be compared against is still PENDING.
#
# That is the whole mechanism, and it is stronger than a hash because it does not depend on anyone
# noticing an edit: the number that could be tuned to fit the floor simply has to exist before the
# floor does. The commit that fills this file necessarily precedes the commit that carries R0e's
# MEASURED literals, and the history records it.
#
# THIS FILE IS NOT HASHED, DELIBERATELY.
# Its fields are REQUIRED to change exactly once, from PENDING to a value. Hashing a file whose
# schedule requires it to change makes re-recording the hash a routine event, and a tripwire that
# fires routinely carries no signal — Rev 2 learned this by having its recorded hash guaranteed to
# break at the `corpus.arrangement` fill, before the first rung that asserted it. The author-frozen
# thresholds that must NEVER change live in docs/VG-CAMPAIGN-THRESHOLDS.toml, and that file is
# hashed.
#
# The gate here is the sentinel rule the repo already uses: goldens/PINS.toml:15 defines that a pin
# whose hash is the literal PENDING is UNBLESSED and makes the checker EXIT 2 rather than pass.
# Same discipline: a rung that needs a field below asserts it is not PENDING, and fails if it is.

schema_version = 2
authored_at_revision = "docs/MESHLET-VIRTUAL-GEOMETRY-PLAN.md Rev 3"
authored_date = "2026-07-27"

# ---------------------------------------------------------------------------------------------
# [claim] — plan SS13 Q1. BLOCKS R0e.
#
# Scope note, and it is load-bearing: the claim is about the BRACKETED VB PASS CHAIN, not a frame
# (docs/VG-CAMPAIGN-THRESHOLDS.toml [scope]). Rev 2 wrote `frame_total` while the floor was
# measured on a pass chain, which made the inequality not evaluable — a frame also contains CSM,
# SDF, DDGI, post/AA, present and all CPU time, none of which this campaign touches.
# ---------------------------------------------------------------------------------------------
[claim]
# "nanite_relative" — the goal stays "faster than Nanite"; requires R0a to record achievable=true.
# "absolute"        — K2 has fired; the goal is restated as "N ms at quality Q on corpus C".
# Both modes close the SAME inequality; only the provenance of the right-hand side differs, which
# is why K2 firing does not leave the campaign without a falsifiability condition.
mode = "PENDING"

# nanite_relative mode: the fractional speedup on the bracketed VB pass chain that the campaign
# intends to claim. 0.20 would mean "we intend to claim we are at least 20% faster on that chain".
# The campaign is only falsifiable if the joint floor is SMALLER than this.
nanite_relative_chain_delta = "PENDING"

# nanite_relative mode: the per-pass rule. A chain-total claim can hide a pass that got slower.
# Evaluable only against the pass-correspondence map R0a is required to record
# (VG-CAMPAIGN-THRESHOLDS.toml [scope].require_pass_correspondence_map_at).
nanite_relative_per_pass_regression_max = "PENDING"

# absolute mode (K2 branch): the target time in milliseconds for the bracketed chain, at the
# decision resolution, on the corpus named in [corpus], at the quality target named in [quality].
# Note that absolute mode is measured by a DIFFERENT and weaker instrument
# (VG-CAMPAIGN-THRESHOLDS.toml [absolute_mode]) — the paired-delta harness cancels exactly the
# terms an absolute reading needs.
absolute_chain_ms = "PENDING"

# ---------------------------------------------------------------------------------------------
# [quality] — plan SS13 Q5. BLOCKS R0f / R0f'.
# ---------------------------------------------------------------------------------------------
[quality]
# The standing lesson of this project is that image statistics have already misled it twice, which
# argues for the owner as arbiter rather than a metric. "owner_visual_eval" | "<metric+threshold>".
arbiter = "PENDING"

# Nanite's error knob, pinned. Its default and its aggressive setting change rendered triangle
# count by roughly an order of magnitude, so an unpinned comparison is not a comparison.
# nanite_relative mode only.
nanite_max_pixels_per_edge = "PENDING"

# ---------------------------------------------------------------------------------------------
# [corpus] — plan SS13 Q3. BLOCKS R0b.
# ---------------------------------------------------------------------------------------------
[corpus]
# Whether a fetched-and-gitignored payload with pinned hashes is acceptable as the permanent
# arrangement, and who selects and licenses the high-poly assets.
arrangement = "PENDING"

# ---------------------------------------------------------------------------------------------
# [gating] — which field blocks which rung. Note R0e, NOT R0f, carries the claim block: that
# ordering IS the P0's fix.
# ---------------------------------------------------------------------------------------------
[gating]
r0a_blocked_by = []
r0b_blocked_by = ["corpus.arrangement"]
r0c_blocked_by = []
r0d_blocked_by = []
r0e_blocked_by = [
    "claim.mode",
    "claim.nanite_relative_chain_delta or claim.absolute_chain_ms (per mode)",
]
r0f_blocked_by = [
    "quality.arbiter",
    "quality.nanite_max_pixels_per_edge (nanite_relative mode only)",
    "claim.nanite_relative_per_pass_regression_max (nanite_relative mode only)",
]
