# Rung VB-P1c (docs/VB-PERFORMANCE-TRACK.md's VB-P1): the CLASSIFIED (TEXTURED) vb_shade_tex
# FROXEL light-cull EQUALITY golden -- closes the VB-P1a "W2" gap ([vb_mesh_froxel] only
# exercised the froxel selector on the NON-textured fused vb_resolve arm). The [vb_mesh_tex]
# textured five-sphere scene (four spheres sharing one real PBR material, forcing the
# classified vb_shade_tex pipeline via GBufferScene::vb_tex_active) plus the SAME 14 point/spot
# lights [vb_mesh_froxel] uses (2 of them CastsPunctualShadow-flagged -- VB-P1-0's regression
# target), all comfortably below MAX_LIGHTS_PER_CLUSTER (256) and INDEX_LIST_CAP (16384). See
# crates/boyko_app/tests/vb_mesh_tex_froxel.rs.
#
# THE EQUALITY CONTRACT: this pin's hash MUST equal the SAME scene rendered with
# BOYKO_VB_FROXEL_FORCE_OFF set (LightingConfig::clusters_enabled forced false -- the flat
# textured baseline leg, i.e. [vb_mesh_tex]'s own light-augmented sibling). vb_shade.comp.hlsl's
# FROXEL and flat arms visit the exact same point/spot lights in the exact same ascending
# table-index order with the exact same per-light range re-test regardless of -D TEXTURED -- the
# loop BODY is token-for-token identical between the two arms, only the index-list SOURCE
# differs -- so the two renders are BYTE-IDENTICAL. Classification (VB-P2, grouping pixels by
# material) and clustering (VB-P1, grouping lights by froxel) are each a byte-preserving
# regrouping of the same per-light accumulation; composing both (this pin) changes neither order
# nor terms. A byte MISMATCH here means either the cull dropped/duplicated a light
# (re-introducing VB-P1-0 under the TEXTURED arm) or the (textured, froxel) pipeline/Set-0
# selector (passes/vb.rs) picked the wrong pipeline.
#
# BLESSED at rung VB-P1c (commit b2b1240): both legs were rendered on a real windowed GPU
# device, confirmed byte-identical to each other, and blessed to that ONE shared hash. The
# sha256_* values below are the real bless output -- this file's only mechanically-checked
# unblessed sentinel is the literal "PENDING", which they are not.
crate           = "boyko-app"
test_binary     = "vb_mesh_tex_froxel"
test_name       = "vb_mesh_tex_froxel_screenshot_dump"
bmp             = "D:\tmp\vb_mesh_tex_froxel.bmp"
width           = 512
height          = 512
sha256_software = "6d7ea00d35c8e77156cb1124d291edcd98209f5124878d7aa459feae81701c23"
sha256_hwrt     = "6d7ea00d35c8e77156cb1124d291edcd98209f5124878d7aa459feae81701c23"

[vb_mesh_tex_froxel.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
BOYKO_HOST_DUMP          = "D:\tmp\vb_mesh_tex_froxel.bmp"
RUSTUP_TOOLCHAIN         = "stable-x86_64-pc-windows-gnu"

[vb_both_taa]
# TAA-under-VB, the VIEWT rung (VisibilityBuffer x Both): [vb_taa]'s taa_jitter_eval scene
# (which REALLY contains an SdfEdit::sphere among the mesh cubes - unlike [vb_both]'s empty
# edit-list) driven through vb x both. The chain this pin freezes: the jittered reverse-Z
# push rasterized by vb_raster, then the HAS_MESH+VIEWT sdf_forward_march variant as the SOLE
# gViewT producer (marched t on SDF-owned pixels, the decoded t_mesh on mesh pixels, the
# 1.0e30 sentinel on background - vb_viewt is structurally OFF here, its arming is
# mesh-and-not-sdf), and the UNCHANGED taa_resolve accumulating over the composited lit.
#
# These bytes MUST differ from [vb_both]'s AA-off frame family (dead-chain alarm) AND from
# [vb_taa] (the SDF sphere is marched here but absent under legs=mesh - if they agree the
# marcher leg went dead). sha256_hwrt EQUALS sha256_software on this scene (each leg blessed
# on its own run - the [vb_taa] precedent).
crate           = "boyko-app"
test_binary     = "taa_jitter_eval"
test_name       = "taa_jitter_eval_screenshot_dump"
bmp             = "D:\tmp\vb_both_taa.bmp"
width           = 512
height          = 512
sha256_software = "61dc2630b15a08712f95be5983a6bd75ffbf03650266857ed62c10cb03b81230"
sha256_hwrt     = "61dc2630b15a08712f95be5983a6bd75ffbf03650266857ed62c10cb03b81230"

[vb_both_taa.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
BOYKO_HOST_DUMP          = "D:\tmp\vb_both_taa.bmp"
