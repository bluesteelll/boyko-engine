# goldens/PINS.toml â€” SINGLE SOURCE OF TRUTH for golden byte-identity pins.
#
# Each pin records the SHA-256 of a dumped BMP plus the exact pipeline it was
# blessed under. This file REPLACES the `58f6c6c3â€¦` hash string that was formerly
# hand-copied across ~10 docs/*.md (miss one file = a silent stale gate).
#
# DO NOT hand-edit the sha256_* values. Update them ONLY via:
#     scripts\golden.ps1 -Pin <name> [-Hwrt] -Bless
# and only AFTER a visual owner sign-off on the freshly-dumped BMP.
#
# Verify a pin (no write):  scripts\golden.ps1 -Pin <name> [-Hwrt] -Check
#
# Format is a flat, section-scoped TOML subset (see scripts\golden.ps1 :: Read-Pins).
# `sha256_hwrt` may equal `sha256_software` (the HW-RT shadow path was made
# byte-identical to software for this scene) or diverge â€” each leg is pinned on its
# own -Bless run, so -Check reports reality regardless.

[grand_showcase]
# The whole-scene refactor gate: mesh + SDF + CSM + punctual + DDGI-off. Any logical
# no-op (god-file split, embed_spirv!, gated-OFF path, host-Rust render diff) MUST keep
# this byte-identical (Tier-0). Host-Rust diffs never pass through DXC FP-lowering, so
# they are never eligible for any perceptual relaxation.
crate           = "boyko_rhi_vulkan"
test_binary     = "window_present_gbuffer"
test_name       = "engine_grand_showcase_512_screenshot_dump"
bmp             = "D:\\tmp\\engine_grand_showcase.bmp"
width           = 512
height          = 512
sha256_software = "a5ad662d2a56efd973487fe49063824c6be841ad07009f5099c0992a491ec718"
sha256_hwrt     = "a5ad662d2a56efd973487fe49063824c6be841ad07009f5099c0992a491ec718"

# Env the pin was blessed under. golden.ps1 SETS these explicitly (never inherits) and
# CLEARS BOYKO_FORCE_SOFTWARE, so a stray shell env cannot silently change the pipeline.
[grand_showcase.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
RUSTUP_TOOLCHAIN         = "stable-x86_64-pc-windows-gnu"

[grand_showcase_2mat]
# Asset-streaming plan F8 â€” the FIRST scene exercising the PER_INSTANCE_MATERIAL raster
# pipeline: five UV-spheres, one material each (default gray, red + green matte dielectrics, a
# low-roughness gold metal, a blue metal); the material drives BOTH albedo (base_color) and
# metallic/roughness. Blessed by the orchestrator (delegated visual oracle) after a sign-off on the
# freshly-dumped BMP (two visibly distinct surfaces) â€” do NOT hand-edit the sha256_* values.
crate           = "boyko-app"
test_binary     = "grand_showcase_2mat"
test_name       = "grand_showcase_2mat_screenshot_dump"
bmp             = "D:\\tmp\\grand_showcase_2mat.bmp"
width           = 512
height          = 512
sha256_software = "f6147f9033fe3ffe6b468088211d4f25e5ba7ff84fdcca3b017bca16c4800684"
sha256_hwrt     = "f6147f9033fe3ffe6b468088211d4f25e5ba7ff84fdcca3b017bca16c4800684"

[grand_showcase_2mat.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
BOYKO_HOST_DUMP          = "D:\\tmp\\grand_showcase_2mat.bmp"
RUSTUP_TOOLCHAIN         = "stable-x86_64-pc-windows-gnu"

[deferred_sdf_only]
# Multi-paradigm render-path plan, rung R3 (Deferred leg-disable, sdf leg): the SAME
# grand_showcase room with resolved_render_path.mesh_leg forced OFF (GeometryLegs::Sdf). The
# mesh raster gbuffer pass (boxes/walls/floor) is skipped, and so is EVERY mesh-shadow producer
# it feeds -- CSM cascade depth, the punctual spot/point atlas depth, and (hwrt leg) the TLAS
# pack/build + the shadow_vis/a-trous/temporal denoise chain (mesh-shadow producers are
# mesh-leg-owned; the SDF leg's shadow is the marcher's own baked soft march, unaffected --
# GpuSceneBundles::scene() P1 fix). The hwrt leg is therefore TLAS-less BY DESIGN under this
# config (no mesh instances to build an acceleration structure from) and renders IDENTICAL to
# software -- sha256_hwrt is expected to equal sha256_software (kept as its own pin, not
# assumed, since every other pin in this file blesses both legs independently). Only the two
# SDF spheres remain, composited by the byte-UNCHANGED marcher against the new
# mesh_depth_neutral_clear pass's far-plane depth. Re-render + re-bless after the P1 scene-
# assembly gate fix landed (do NOT hand-edit sha256_*).
crate           = "boyko_rhi_vulkan"
test_binary     = "window_present_gbuffer"
test_name       = "engine_deferred_sdf_only_512_screenshot_dump"
bmp             = "D:\\tmp\\deferred_sdf_only.bmp"
width           = 512
height          = 512
sha256_software = "ffcc0ac6f70a6cdcd113e343ef2d65a9a3f8134478917f35bec73991d3d5515f"
sha256_hwrt     = "ffcc0ac6f70a6cdcd113e343ef2d65a9a3f8134478917f35bec73991d3d5515f"

[deferred_sdf_only.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
RUSTUP_TOOLCHAIN         = "stable-x86_64-pc-windows-gnu"

[deferred_mesh_only]
# Multi-paradigm render-path plan, rung R3b (Deferred leg-disable, mesh leg -- the mirror-image
# of [deferred_sdf_only]): the SAME grand_showcase room with resolved_render_path.sdf_leg forced
# OFF (GeometryLegs::Mesh). The SDF marcher is not dispatched at all (no two SDF spheres), so the
# scene renders ONLY the mesh boxes/walls/floor with their CSM + punctual-atlas shadows (mesh-leg-
# owned producers, unaffected -- mesh_leg is true here). The new viewt_from_depth compute pass
# replaces the marcher as the sole gViewT producer for every pixel, so the resolve/SSAO still see
# a real mesh surface depth exactly as under GeometryLegs::Both. The hwrt leg keeps its TLAS armed
# as normal (mesh instances exist to build an acceleration structure from), unlike the sdf-only
# sibling pin above.
#
# UNBLESSED placeholders -- the sha256_* values below are NOT real hashes. Re-render on a real
# windowed GPU device (engine_deferred_mesh_only_512_screenshot_dump, #[ignore]) and re-bless via
# `scripts\golden.ps1 -Pin deferred_mesh_only -Bless` (and `-Hwrt -Bless`) AFTER the owner's
# visual sign-off on the freshly-dumped BMP, per this repo's golden discipline (do NOT hand-edit
# these values otherwise).
crate           = "boyko_rhi_vulkan"
test_binary     = "window_present_gbuffer"
test_name       = "engine_deferred_mesh_only_512_screenshot_dump"
bmp             = "D:\\tmp\\deferred_mesh_only.bmp"
width           = 512
height          = 512
sha256_software = "65cb2004f3a8bcace12896cd2a5c4f959e2e7ae53d2f75f8b4ea21d9ee004ada"
sha256_hwrt     = "65cb2004f3a8bcace12896cd2a5c4f959e2e7ae53d2f75f8b4ea21d9ee004ada"

[deferred_mesh_only.env]
BOYKO_DISABLE_VALIDATION = "1"
BOYKO_SHADOW_DENOISE     = "none"
RUSTUP_TOOLCHAIN         = "stable-x86_64-pc-windows-gnu"
