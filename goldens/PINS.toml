# TWO KNOBS, ON PURPOSE. `BOYKO_PARTICLE_SDF` puts the collider AND the per-effect contact
# parameters in the scene; `BOYKO_PARTICLE_COLLIDE` picks the shader module. Splitting them is what
# makes the control exact -- with only the first set, the two runs differ in ONE BIT, so "they
# bounced" cannot be explained by the scene having changed.
