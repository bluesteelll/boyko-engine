[taa_armed_basis]
# AA Stage 4 rung T0 (sibling): the same armed-TAA scene through rung C1's OPT-IN b5 camera-basis
# shear (`jitter_scope = RasterAndBasis`), the path that finally makes the Halton jitter reach the
# shading sample position rather than only the raster mesh vertex push.
#
# Why it is worth its own bytes: the shear is the campaign's keystone and its ONLY structural
# guard today is that `RasterOnly` stays the default. This pin is what would catch a regression
# that silently disarms the shear -- a failure mode with NO other symptom, because a disarmed
# shear renders a perfectly plausible picture (it is precisely the picture we shipped for months).
# Proven live at bless: with the mesh leg disabled, Halton phase 0 vs phase 4 goes from 0 differing
# pixels under `RasterOnly` to 70662 (8.72%) here.
#
# These bytes MUST differ from [taa_armed]'s. If the two pins ever agree, the shear is dead.
#
# Rung T2 (the resolve-policy knobs) moved these bytes by exactly ONE pixel at 1/255, while
# [taa_armed] stayed byte-identical through the same change. That asymmetry IS the diagnosis, and
# it is worth keeping: both legs run the identical shader at the identical `TaaConfig::default()`
# mode words -- the ONLY thing that differs is the b6 basis, i.e. the VALUES fed to the resolve. So
# T2's added branches perturbed float evaluation ORDER, and for one pixel's values the result
# rounded one quantization step differently. A structural defect could not produce 1 px; it would
# move the frame wholesale. Re-blessed on that measurement, NOT on a visual check -- 1/255 on a
# single pixel is not something an eye can adjudicate, and pretending otherwise would be theatre.
# Measured on the software leg (262144 px, delta histogram {1: 1}); the hwrt leg is inferred from
# the same cause, not separately measured.
#
# Rung C2 is baked into these bytes: C1 shipped with the shear leaking into taa_resolve's OWN
# reprojection (it built `P` from the sheared basis, then reprojected it with an UNJITTERED
# `mc_prev_view_proj`), so the history lookup wobbled with the Halton phase and progressively
# BLURRED the history instead of accumulating it. The owner caught it by eye on a mesh cube's edge
# while a whole-frame "intermediate tone" metric was reporting the blur as a 10-point ANTIALIASING
# GAIN -- the metric cannot tell blur from AA. Fixed by reprojecting differentially,
# `history_uv = pixel_uv + (prev_uv - cur_uv)`, which is exactly zero for a static camera BY
# CONSTRUCTION. Post-fix, the marched sphere still antialiases (0.0% -> 38.3% edge-ramp share vs AA
# off, measured on the SDF-only leg) while the cube's edge profile is now identical to [taa_armed]'s.
#
# Shadow gate SG4 moved these bytes, for the reason recorded in [taa_armed] (vkval lane; ruled and
# re-blessed 2026-09-18 on the msvc host -- software 87559012 -> 456b4060, hwrt 70aefdfb ->
# 0809d4b9). The fixture's hand-seeded `LightingConfig.csm_shadows = true` makes frame 0 a
# header-ON, host-unarmed frame, which used to sample a cascade no pass had written and now reads
# the DISABLED cascade UBO; TAA carries that frame into history. On the software leg that is 2
# pixels at max channel delta 1/255 on the SDF sphere's rim, measured against the e3cebe2d frame.
# These bytes still differ from [taa_armed]'s, so the shear is still live.
#
# R4-frame-order + R4b-open-edges moved these bytes, and the pinned ones were wrong on two counts,
# for the reasons recorded in [taa_armed] (lane fix/light-table-defects; ruled and re-blessed
# 2026-09-21 on the msvc host -- software 456b4060 -> 53ba8049 (4,444 px changed, max channel
# delta 13), hwrt 0809d4b9 -> 32ba8e29 (2,100 px, max 14)): frame 0 drew 0 meshes under the
# undeclared `visibility_sync` / reader order (R4's E1), and frame 0 was lit from the sun's identity
# `GlobalTransform` because `light_reconcile` ran before `propagate_transforms` (R4b's edge C); TAA
# carried that frame. The hwrt value with edge C removed equals the G2-edge value
# (ee8701b257f19ec7e4d68707aca0905c56d4c8fc4ff3479b97fbf903676889ec), which is the mesh-only move;
# the software value with edge C removed is the mesh-only value 114767d1. These bytes still differ
# from [taa_armed]'s, so the shear is still live.
# HWRT SHADOW-RAY ORIGIN MOVED THESE BYTES (lane fix/hwrt-shadow-ray-origin; re-blessed 2026-09-21 on the
# msvc host -- hwrt 32ba8e29 -> 3af811ff; the software hash 53ba8049 is unchanged). The pinned hwrt
# frame carried a false-shadow region -- 148,056 px (56.5 % of the frame) darker than the software
