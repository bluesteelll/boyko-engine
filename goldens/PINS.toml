[particle_sdf_collide]
# Particles P1 gate -- the SDF-collision image pin. The same one-emitter fixture as
# `particle_additive`, plus an `SdfPrimitive` slab (a 4 x 0.2 x 4 box at y = 2.0) standing above the
# upward fan, with the sim built from the `-D SDF_COLLIDE` module.
#
# WHAT THE BYTES SAY, and what makes them a pin rather than a picture: the particles stop at the
# slab. MEASURED at this capture against the control run (`BOYKO_PARTICLE_SDF` set,
# `BOYKO_PARTICLE_COLLIDE` unset -- the same scene, the same effect table, the same clock, the
# pipeline built from the base module instead): above the contact plane this image holds ZERO
# near-white pixels while the control holds 164; the topmost white row is 216 here and 99 there,
# against a slab-underside row of 219 predicted from the camera. The fan's x-range is identical in
# both (`[175,386]`) because the fixture's friction is 0 and the tangential component is untouched.
