[taa_armed]
# AA Stage 4 rung T0: the ARMED-TAA gate. Until this pin existed, every one of the other pins
# rendered with `AaMode::Off` (the default), so the whole temporal path -- the jitter, the history
# ring, the reprojection, the variance clamp, the reset transition -- carried ZERO regression
# protection: an ON-path change could only be caught by someone re-running an eval by hand.
#
# This pin renders `AaMode::Taa` at its shipped default `jitter_scope = RasterOnly`, i.e. exactly
# what a world that sets `AaConfig { mode: Taa }` and nothing else gets today. Its sibling
# [taa_armed_basis] pins the opt-in shear; the PAIR is the point -- the two must differ, and
# `-Check`ing both is what proves `JitterScope` still selects anything at all.
#
# `BOYKO_TAA_PHASE` is deliberately NOT set: an unpinned phase cycles HALTON_8 across the 30
# `SETTLE_FRAMES` presented before the readback, so these bytes exercise REAL multi-phase temporal
# accumulation rather than convergence onto a single frozen offset. Determinism was proven before
# blessing -- two separate processes at an identical phase produced 0 differing pixels out of
# 810000 (crates/boyko_app/tests/taa_jitter_eval.rs, the A0 control). The corollary: this pin is
# legitimately sensitive to `host_dump::SETTLE_FRAMES` and to the Halton table. If either changes,
# these bytes SHOULD move, and that is the pin doing its job -- not a flake to bless away.
#
# sha256_hwrt DIVERGES from sha256_software here, unlike most pins in this file -- and that is
# correct, not a defect. Under `hwrt` the DIRECTIONAL shadow term is a rayQuery mesh trace, not the
# CSM cascade lookup: deferred_pbr.hlsl's `#if HWRT` arm never calls csm_visibility at all (which is
# also why the four deferred_pbr_hwrt_* blobs are byte-identical across CSM-kernel edits -- DXC
# eliminates the uncalled function). The two legs therefore render genuinely different shadows, and
# TAA accumulates those different inputs. Each leg is pinned on its own -Bless run.
#
# NB an earlier draft of this comment claimed the ray backend "has nothing to change here" because
# the scene's directional shadow is CSM. The bless disproved it on the spot: the legs' hashes
# differ. Left recorded because the wrong version was plausible enough to write.
#
# SHADOW GATE SG4 MOVED THESE BYTES, and the new ones are the DEFINED frame (vkval lane; ruled and
# re-blessed 2026-09-18 on the msvc host -- software ee3a8a8c -> 765de1d9, hwrt 109c7055 ->
# 0acc66b5). The fixture hand-seeds the DERIVED bit `LightingConfig.csm_shadows` to true (no pin
# sets BOYKO_CSM_OFF; crates/boyko_app/tests/taa_jitter_eval.rs, at the seed's "STAYS, on purpose"
# comment), while `sync_csm_light_gate`, which owns that bit, runs one frame behind
# `collect_lights`. So on frame 0 the light header's CSM bit is ON while the host is unarmed -- no
# caster batch yet, so no cascade pass records. Before SG4 that frame sampled cascades no pass had
# written, through the live fitted cascade UBO: the pixel depended on memory nothing wrote. SG4
# uploads `ResolvedCsm::DISABLED` on every unarmed frame (crates/boyko_app/src/runner.rs step 5d,
# `frame_uniform`), so frame 0 now reads `gCsmActive == 0` and samples no cascade. TAA carries
# frame 0 into history, and what survives the settle frames is 5 pixels, max channel delta 3/255,
# on the SDF sphere's upper rim (x 182-201, y 155-158) -- measured against the e3cebe2d frame, the
# same 5 pixels and deltas on both legs. The seed STAYS: it is the goldens' only witness of a
# header-LEADS-host frame, and it refutes the shadow design's D4 premise that a static scene's
# header only ever trails the host.
#
# LIGHT-TABLE R2 MOVED THESE BYTES BY ONE PIXEL (lane fix/light-table-defects; re-blessed
# 2026-09-19 on the msvc host -- software 765de1d9 -> 31ce5178, hwrt 0acc66b5 -> c6429c3e). R2
# makes the Deferred SDF marcher take the light table's primary sun instead of a boot constant (see
# [grand_showcase_2mat]). This scene's sun IS that constant, [-0.45, 0.82, 0.36]
# (crates/boyko_app/tests/taa_jitter_eval.rs, SUN_DIR), so the direction did not change, only its
# bits. The old push was the raw, non-unit constant, normalised in the shader; the new one is the
# table's value, the pose's direction after the quaternion round-trip, normalised by
# GpuLight::from_directional. The two agree to rounding, and that difference crosses one 8-bit step
# at one pixel: (236, 191), 1 LSB darker, the same pixel on both legs. An A/B that pushed the raw
# constant through the new path restored 765de1d9 and 0acc66b5, so the rounding is the whole change.
#
# R4-FRAME-ORDER + R4b-OPEN-EDGES MOVED THESE BYTES, AND THE PINNED ONES WERE WRONG ON TWO COUNTS
# (lane fix/light-table-defects; ruled and re-blessed 2026-09-21 on the msvc host -- software
# 31ce5178 -> b1e3b254 (7,275 px changed, max channel delta 15), hwrt c6429c3e -> ebddcd7d
# (5,031 px, max 14)). Two orders the shipped host never declared decided the pinned frame 0, and
# both ran the wrong way:
#  * Frame 0 drew 0 meshes under the undeclared `visibility_sync` / reader order: the mesh and
#    caster gathers filter on `Enabled<RenderEnabled>`, which `visibility_sync` sets through a
#    deferred command, and nothing ordered the readers after that writer -- the executor's wave
#    packing ran the gathers first (measured: 0 draw rows on frame 0, 7 on every later frame).
#    R4's E1, `VisibilitySet::Read.after(VisibilitySet::Sync)` in crates/boyko_app/src/plugins.rs.
#  * Frame 0 was lit from the sun's identity `GlobalTransform`, because `light_reconcile` ran before
#    `propagate_transforms`: the fixture spawns the sun with a posed `Transform` and
#    `GlobalTransform::IDENTITY` (crates/boyko_app/tests/taa_jitter_eval.rs, the
#    `DirectionalLightObject` spawn), and the reconcile (`Changed<GlobalTransform>`,
#    crates/boyko_render/src/light_reconcile.rs) copied the identity pose's direction into the
#    light table -- measured in 34 of 34 frames of the order dump, the docs/OPEN-QUESTIONS.md
#    2026-09-19 (b) finding. R4b's edge C, `LightReconcileSet.after(CameraSet::Resolve)`, in the
#    same file.
# TAA carried that frame into its history; what survives the settle frames sits on the mesh
# silhouettes and on the SDF sphere's terminator. Attribution by single-edge A/B on the lane tree:
# the hwrt value with edge C removed equals the G2-edge value
# (1dde137bc09f5fa0ba0f06824990e1be6f179cc8c720ff5164cef48208f9c261), which is the mesh-only move;
# the software value with edge C removed is the mesh-only value ae67351d. Removing only the G2 edge
# (the light seed's `.before(cull)`) moves nothing on either leg any more -- the pair it used to
# flip is declared now.
# HWRT SHADOW-RAY ORIGIN MOVED THESE BYTES (lane fix/hwrt-shadow-ray-origin; re-blessed 2026-09-21 on the
# msvc host -- hwrt ebddcd7d -> 6f6cb89e; the software hash b1e3b254 is unchanged). The pinned hwrt
# frame carried a false-shadow region -- 100,916 px (38.5 % of the frame) darker than the software
# leg by > 30 LSB on the far floor, the cube tops and the wall -- from deferred_pbr.hlsl
# reconstructing the cone-trace origin on the b5 pixel ray while a raster-owned pixel's gViewT is the
# Euclidean distance the JITTERED raster wrote (frame 30 is Halton phase 7, jy = +0.389 px; the origin
# sat up to 6.9 mm under the floor beyond t ~ 2.9 m, and every one of the 16 cone rays self-hit the
# receiver from below). The origin now uses the ray through the raster's own sub-pixel sample
# (`SHADOW_RASTER_FWD` / `SHADOW_ORIGIN_MODE` in the 48-B RayShadowUbo, `boyko_render::RayShadowFrame`,
# `raster_ray_forward` in view.rs) on raster-owned pixels, told apart from SDF-owned ones bit-exactly
# (`gViewT == md*64` against the raster depth `gDepthHw` @21). Measured against the software leg on
# the new frame (exact bytes): 109 px darker by > 30 LSB, all within the two legs' intrinsic
# difference -- 96 px on one contact-shadow line at the right cube's wall base (x 422-452,
# y 196-201; the cone trace draws it, the CSM never does; present in the old pin and on the TAA-off
# hwrt frame, 95 of the 96 coincident) plus 13 px in the penumbra strip (x 162-185, y 203-315; the
# soft cone vs Tent13 PCF). The TAA-off hwrt-vs-software difference, the regime without the defect,
# is 125 px on exact bytes (the probe's window-resampled figure was 270). The earlier note's "the
# two legs render genuinely different shadows" was this artefact, not the trace's softness. Gates:
# taa_jitter_eval::{hwrt_shadow_origin_phase7,hwrt_shadow_origin_all_phases,
# hwrt_shadow_origin_consecutive_frames} (gpu-windowed, --features hwrt) -- red on the tree before
# the fix (band-F delta 42.1 LSB / 29,951 px; max phase pair 97,853 px; max consecutive-frame
# change 95,748 px), green after (0.236 LSB / 0 px; 0 px; 0 px).
crate           = "boyko-app"
test_binary     = "taa_jitter_eval"
test_name       = "taa_jitter_eval_screenshot_dump"
bmp             = "D:\\tmp\\taa_armed.bmp"
